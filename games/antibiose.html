<style>
/* Layout: one-screen portrait app styled as a lab instrument. Monitor-style HUD, microscope eyepiece field, drug cartridges at thumb height. */
:root{
  --bg:#e8ebf3; --grid:rgba(90,52,176,.06); --surface:#ffffff; --surface-2:#f3f1fa; --ink:#131a2a; --muted:#5d6577; --line:#d3d6e4;

  --field:#fbfaf3; --field-edge:#c8ccd8; --field-glow:rgba(90,52,176,0);
  --label-bg:rgba(255,255,255,.9); --label-ink:#131a2a;
  --gpos:#4f2a9c; --gneg:#d1497a; --virus:#0d7f86; --fungus:#b77a06; --nostain:#7c8590; --proto:#5f7a10; --afb:#d9480f; --helm:#8b5a2b; --ecto:#2f6db5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070a12; --grid:rgba(169,139,255,.05); --surface:#111725; --surface-2:#171f31; --ink:#e7ecf6; --muted:#8f9bb2; --line:#232c40;
  --accent:#a98bff; --accent-ink:#120a26; --accent-soft:#221a3d; --accent-glow:rgba(169,139,255,.45);
  --ok:#43d491; --warn:#f3b74a; --danger:#ff6170; --scrim:rgba(0,0,0,.66);
  --field:#0b1019; --field-edge:#010204; --field-glow:rgba(120,90,255,.18);
  --label-bg:rgba(8,11,18,.82); --label-ink:#e7ecf6;
  --gpos:#a98bff; --gneg:#ff7fab; --virus:#3fd8d0; --fungus:#f4bc4c; --nostain:#b6bfca; --proto:#c4e05a; --afb:#ff8a4c; --helm:#e0a36b; --ecto:#7fb0ff;
  --host:#1b2333; --edge:rgba(231,236,246,.35); --spore:#f6f2e3; --w-bac:#a98bff; --glow:1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070a12; --grid:rgba(169,139,255,.05); --surface:#111725; --surface-2:#171f31; --ink:#e7ecf6; --muted:#8f9bb2; --line:#232c40;
  --accent:#a98bff; --accent-ink:#120a26; --accent-soft:#221a3d; --accent-glow:rgba(169,139,255,.45);
  --ok:#43d491; --warn:#f3b74a; --danger:#ff6170; --scrim:rgba(0,0,0,.66);
  --field:#0b1019; --field-edge:#010204; --field-glow:rgba(120,90,255,.18);
  --label-bg:rgba(8,11,18,.82); --label-ink:#e7ecf6;
  --gpos:#a98bff; --gneg:#ff7fab; --virus:#3fd8d0; --fungus:#f4bc4c; --nostain:#b6bfca; --proto:#c4e05a; --afb:#ff8a4c; --helm:#e0a36b; --ecto:#7fb0ff;
  --host:#1b2333; --edge:rgba(231,236,246,.35); --spore:#f6f2e3; --w-bac:#a98bff; --glow:1;

}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font:15px/1.45 var(--f-body);
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}

/* HUD: patient-monitor panel */
.hud{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:8px;min-width:0}
.lbl{font:600 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.score{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.score>div{min-width:0}
.val{font:800 clamp(19px,6.2vw,26px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.bump{animation:bump .25s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.combo{flex:none;font:800 12px/1 var(--f-display);padding:5px 7px;border-radius:99px;color:var(--muted);border:1.5px solid var(--line)}
.combo.hot{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.case{flex:none;text-align:right;line-height:1.2}
.case b{display:block;font:800 14px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gauge{padding:6px 8px;border-radius:12px;background:var(--surface-2);min-width:0}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px;min-width:0}
.g-top b{font:600 11px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-body{height:22px;display:flex;align-items:center;min-width:0}
#ecg{width:100%;height:22px;display:block}
.track{height:7px;width:100%;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:100%;border-radius:inherit;transform-origin:left;transition:transform .25s ease,background-color .25s}
#progFill{background:var(--accent)} #riskFill{background:var(--warn)} #riskFill.hi{background:var(--danger)}
#vitalTxt.low{color:var(--danger)}
@media (max-width:380px){.gauge{padding:5px 6px}.lbl{letter-spacing:.03em;font-size:9.5px}.g-top b{font-size:10px}.hud{padding:8px 10px}.iconbtn{width:38px;height:38px}}

/* Field: microscope eyepiece */
.field{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--field);
  box-shadow:0 0 28px var(--field-glow),inset 0 0 0 1px var(--field-glow)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.pt{position:absolute;top:10px;left:10px;max-width:58%;padding:5px 9px;border-radius:10px;background:var(--label-bg);border:1.5px solid var(--danger);font-size:12px;line-height:1.25;pointer-events:none}
.pt .lbl{display:block;color:var(--danger)}

/* Lesson strip: fixed height so the slide never jumps; text shrinks to fit */
.lesson{flex:none;height:66px;display:flex;align-items:center;padding:0 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.lesson p{margin:0;font-size:13.5px;line-height:1.25;max-height:62px;overflow:hidden}
.chip{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.03em;padding:3px 6px;border-radius:99px;margin-right:6px;vertical-align:1px;border:1.5px solid currentColor;white-space:nowrap}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--danger)} .c-acc{color:var(--accent)}

/* Drug cartridges */
.weapons{flex:none;display:grid;gap:8px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.wbtn{height:76px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;overflow:hidden;
  padding:21px 9px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;position:relative;min-width:0;
  transition:transform .1s ease,border-color .15s,box-shadow .15s,background-color .15s}
.wbtn::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--dc)}
.wbtn:active{transform:scale(.97)}
.wbtn .wn{display:block;font-weight:700;font-size:15px;line-height:1.12;max-height:2.3em;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:manual;-webkit-hyphens:manual;min-width:0}
.wbtn .wt{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px;align-items:center;min-width:0;overflow:hidden}
.pips i{flex:none;width:12px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--dc)}
.loaded{position:absolute;top:8px;left:9px;font:600 9px var(--f-mono);letter-spacing:.1em;color:var(--accent);opacity:0}
.wbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent),0 6px 18px var(--accent-glow);transform:translateY(-2px)}
.wbtn[aria-pressed="true"] .loaded{opacity:1}
.wbtn.tip{animation:tip 1s ease-in-out infinite}
@keyframes tip{50%{box-shadow:0 0 0 4px var(--ok);border-color:var(--ok)}}
.wbtn kbd{display:none}
@media (hover:hover) and (pointer:fine){.wbtn kbd{display:inline;font:500 10px var(--f-mono);color:var(--muted);position:absolute;top:8px;right:9px}}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(480px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;
  padding:22px 18px;display:flex;flex-direction:column;gap:14px;animation:rise .3s cubic-bezier(.2,.8,.2,1) both;-webkit-user-select:text;user-select:text;
  box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px var(--field-glow);overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
.card h1{font:800 clamp(34px,11vw,54px)/.95 var(--f-display);margin:0;letter-spacing:-.04em;color:var(--accent);text-shadow:0 0 24px var(--accent-glow)}
.card h2{font:800 clamp(20px,6vw,24px)/1.15 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;hyphens:none}
.card h3{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px}
.card p{margin:0}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:16px}
.fine{font-size:12.5px;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:8px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:52px;border-radius:15px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:6px 14px;line-height:1.2;box-shadow:0 6px 20px var(--accent-glow);hyphens:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px;hyphens:none}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.rules{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:0;font-size:14px;align-items:baseline}
.rules dt{font:700 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rules dd{margin:0}
.mics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mic{display:flex;align-items:center;gap:8px;min-width:0}
.mic>div{min-width:0}
.mic canvas{width:44px;height:44px;flex:none;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.mic b{display:block;font-size:13.5px;line-height:1.2}
.mic small{display:block;font:500 10.5px/1.25 var(--f-mono);color:var(--muted);hyphens:none}
.drugs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;font-size:13.5px}
.drugs b{font-weight:700}
.drugs .wt{font:500 11px var(--f-mono);color:var(--muted);margin-left:6px;white-space:nowrap}
.ptcard{padding:10px 12px;border-radius:12px;border:1.5px solid var(--danger);font-size:14px}
.ptcard b{color:var(--danger)}
.chart{overflow-x:auto;border:1px solid var(--line);border-radius:12px;hyphens:none}
.chart table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.chart th,.chart td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.chart th:first-child,.chart td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700}
.chart thead th{font:600 10.5px var(--f-mono);color:var(--muted)}
.chart tr:last-child td{border-bottom:0}
.chart .s{color:var(--accent);font-weight:700}.chart .y{color:var(--ok);font-weight:700}.chart .n{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.stats b{display:block;font:800 clamp(18px,5.5vw,22px)/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.grade{font:800 64px/1 var(--f-display);color:var(--accent);text-shadow:0 0 24px var(--accent-glow)}
.review{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

.chap{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);min-width:0;position:relative;overflow:hidden}

@keyframes eq{0%,100%{height:25%}50%{height:100%}}

function why(w,t){
  const W=WPN[w],m=MIC[t],k=w+'|'+t,bug=['gpos','gneg','none','afb'].includes(m.kind);
  if(WHY[k])return WHY[k];
  if(w==='sup')return `${m.short} has a treatment that helps. Supportive care alone isn’t enough.`;
  if(m.best.includes('sup'))return `No antiviral is routinely used for ${m.short}. ${SN(t)}`;
  if(t==='pjp')return 'Pneumocystis is a fungus, but standard antifungals miss it. TMP-SMX is the treatment.';
  if(t==='mtb')return `TB needs a months-long multidrug regimen (RIPE). ${W.name} alone won’t cure it.`;
  if(w==='nys')return 'Nystatin isn’t absorbed. It only treats thrush on the surface of the mouth.';
  if(w==='pq')return 'Primaquine targets dormant liver hypnozoites, not this stage.';
  if(m.kind==='fungus'&&W.cls==='bac')return `Antibacterials don’t kill fungi. ${m.short} needs an antifungal.`;
  if(bug&&W.cls==='tb')return `${W.name} is built for mycobacteria. ${m.short} needs a different antibiotic.`;
  if(m.nowall&&(W.bl||w==='vanc'))return `Mycoplasma has no cell wall, so ${W.name} has nothing to attack.`;
  if(m.intra&&(W.bl||w==='vanc'))return `${m.short} lives inside host cells, out of reach of ${W.name}.`;
  if((t==='mrsa'||t==='mrsap')&&W.bl)return `MRSA’s PBP2a resists ${W.name} and the other standard β-lactams.`;
  if(t==='sepi'&&W.bl)return 'Most S. epidermidis carry mecA like MRSA, so β-lactams fail.';
  if((t==='efa'||t==='vre')&&W.ceph)return 'Enterococci are intrinsically resistant to every cephalosporin.';
  if(m.kind==='gneg'&&w==='vanc')return 'Vancomycin is too large to cross the gram-negative outer membrane.';
  if(m.kind==='gneg'&&(w==='lzd'||w==='dap'))return `${W.name} only covers gram-positives.`;
  if(w==='mtz'&&bug)return `Metronidazole only kills obligate anaerobes. ${m.short} isn’t one.`;
  const worm=['alb','meb','pyr','pzq','dec','ivm'].includes(w);
  if(worm&&m.kind==='proto')return `${W.name} treats worms. ${m.short} is a single-celled protozoan.`;
  if(!worm&&W.cls==='par'&&w!=='per'&&m.kind==='helm')return `${W.name} treats protozoa, not worms like ${m.short}.`;
  return `${W.name} doesn’t reliably cover ${m.short}. ${W.scope}`;
}

      lesson(first?`★ +${pts}`:`✓ Covered +${pts}`,first?'c-ok':'c-warn',first?`<b>${mm.short}:</b> ${mm.fact}`:`${WPN[w].name} covers ${mm.short}. First-line is ${names(mm.best)}.`);beep(880,.09,'sine',.05);beep(1320,.12,'sine',.04,.07)}
    else     if(isBest){G.streak++;const pts=15*mult();G.score+=pts;G.ls.best++;G.ts.best++;addText(m.x,m.y,`+${pts}`,C.ok);
      lesson(mult()>1?`★ +${pts} ×${mult()}`:'★ First-line',mult()>1?'c-acc':'c-ok',`<b>${mm.short}:</b> ${mm.fact}`);beep(880,.09,'sine',.05);beep(1320,.12,'sine',.04,.07)}
    else{G.streak=0;G.score+=5;G.ls.works++;G.ts.works++;addText(m.x,m.y,'+5',C.warn);
      lesson('✓ Works +5','c-warn',WORKS[w+'|'+t]||`${WPN[w].name} works, but ${names(bf)} is first-line for ${mm.short}.`);beep(620,.1,'sine',.04)}
  }else{
    G.streak=0;m.shake=.4;m.flash=1;const txt=why(w,t),hint=LEVELS[G.lv].spec?'Hold fire on this one.':`Use ${names(bestFor(t,G.lv))}.`;
    if(repeat)lesson('✗ Still resistant','c-bad',`${txt} ${hint}`);
    else{G.score=Math.max(0,G.score-10);G.ls.wrong++;G.ts.wrong++;addText(m.x,m.y,'−10',C.danger);
      G.lessons.set(w+'|'+t,`<b>${WPN[w].name} → ${mm.short}:</b> ${txt}`);lesson('✗ Resistant −10','c-bad',`${txt} ${hint}`)}

  }

/* ---------- Loop ---------- */
function update(dt){
  const L=LEVELS[G.lv];G.t+=dt;
  if(G.phase==='play'){
    G.spawnT-=dt;const alive=G.mobs.filter(m=>!m.dead).length;
    if(G.spawnT<=0&&alive<4+Math.floor(G.lv*.4)){spawn();G.spawnT=L.iv*(1-.35*Math.min(1,G.kills/L.q))*(.8+Math.random()*.4)}
    for(const m of G.mobs){if(m.dead)continue;m.y+=m.v*dt;if(m.y-R*.3>ESC)escape(m);if(G.phase!=='play')break}
    if(G.risk>0){const before=Math.round(G.risk);G.risk=Math.max(0,G.risk-1.5*dt);if(Math.round(G.risk)!==before)riskHud()}
    tutorial();
  }else if(G.phase==='menu'||G.phase==='over'){ // attract mode behind cards
    for(const m of G.mobs){if(m.dead)continue;m.y+=m.v*dt*.5;if(m.y>ESC-R)m.y=-R}
  }
  for(const m of G.mobs){m.x=m.x0+Math.sin(m.ph+G.t*m.fr)*m.amp;m.rot+=m.spin*dt;if(m.shake>0)m.shake-=dt;if(m.flash>0)m.flash-=dt*2;if(m.dead)m.die+=dt*3}
  G.mobs=G.mobs.filter(m=>!(m.dead&&(m.die>=1||m.escaped)));
  for(const p of G.shots){const tx=p.tgt&&!p.tgt.dead?p.tgt.x:p.tx,ty=p.tgt&&!p.tgt.dead?p.tgt.y:p.ty,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),s=1300*dt;
    p.trail.push([p.x,p.y]);if(p.trail.length>7)p.trail.shift();
    p.a=Math.atan2(dy,dx);if(d<=s){p.done=1;if(G.phase==='play')resolve(p)}else{p.x+=dx/d*s;p.y+=dy/d*s}}
  G.shots=G.shots.filter(p=>!p.done);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt*1.8}G.parts=G.parts.filter(p=>p.life>0);
  for(const r of G.rings){r.r+=R*4*dt;r.life-=dt*2.5}G.rings=G.rings.filter(r=>r.life>0);
  for(const t of G.texts){t.y-=42*dt;t.life-=dt*1.2}G.texts=G.texts.filter(t=>t.life>0);
  for(const d of DEBRIS){d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y-d.r>H){d.y=-d.r;d.x=Math.random()*W}}
  if(G.hurt>0)G.hurt-=dt;if(G.shake>0)G.shake-=dt;if(G.muzzle>0)G.muzzle-=dt*5;
  if(G.phase==='ending'){G.endT-=dt;if(G.endT<=0){saveBest();LEVELS[G.lv].spec?showSpecEnd(G.won):G.won?(G.lv===CHAPTERS[LEVELS[G.lv].ch].last?showWin():showClear()):showOver()}}
}
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
// Labels go in their own pass, on top of every sprite, clamped to the slide and nudged apart so none overlap
function drawLabels(){
  const placed=[],items=G.mobs.filter(m=>!m.dead&&SPR[m.t]).sort((a,b)=>b.y-a.y);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const m of items){
    const L=LW[m.t],w=L.w+12,h=16;let cx=Math.min(W-w/2-4,Math.max(w/2+4,m.x)),cy=m.y+R*1.15;
    for(const dy of [0,-h-4-R*2.3,h+3,-(h+3)]){const y=m.y+R*1.15+dy;if(!placed.some(p=>Math.abs(p.x-cx)<(p.w+w)/2+2&&Math.abs(p.y-y)<h+2)){cy=y;break}}
    placed.push({x:cx,y:cy,w});
    ctx.globalAlpha=1;ctx.fillStyle=C.lblBg;rr(cx-w/2,cy-h/2,w,h,8);ctx.fill();ctx.font=L.f;ctx.fillStyle=C.lblInk;ctx.fillText(MIC[m.t].short,cx,cy+.5);
  }
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.shake>0&&!RM.matches)ctx.translate((Math.random()-.5)*8*G.shake/.3,(Math.random()-.5)*8*G.shake/.3);
  if(BG)ctx.drawImage(BG,0,0,W,H);else{ctx.fillStyle=C.field;ctx.fillRect(0,0,W,H)}
  // out-of-focus debris for depth
  ctx.fillStyle=C.muted;for(const d of DEBRIS){ctx.globalAlpha=.05;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill()}ctx.globalAlpha=1;
  for(const m of G.mobs){
    const s=SPR[m.t];if(!s)continue;const sh=m.shake>0&&!RM.matches?Math.sin(m.shake*60)*5:0,k=m.dead?Math.min(1,m.die):0,br=RM.matches?1:1+.035*Math.sin(G.t*3+m.ph);

  }

    ctx.fillStyle=C.spore;ctx.beginPath();ctx.moveTo(0,-4.5);ctx.arc(4,0,4.5,-Math.PI/2,Math.PI/2);ctx.lineTo(0,4.5);ctx.fill();ctx.restore()}
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}ctx.globalAlpha=1;
  ctx.font='800 17px "Unbounded","IBM Plex Sans",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of G.texts){const x=Math.min(W-28,Math.max(28,t.x));ctx.globalAlpha=Math.max(0,Math.min(1,t.life*1.5));ctx.lineWidth=4;ctx.strokeStyle=C.lblBg;ctx.strokeText(t.s,x,t.y-R);ctx.fillStyle=t.col;ctx.fillText(t.s,x,t.y-R)}ctx.globalAlpha=1;
  // syringe launcher
  if(G.w&&G.phase!=='menu'&&G.phase!=='over'){const sx=W/2,sy=H-22,c=wcol(G.w);ctx.save();ctx.translate(sx,sy);ctx.rotate(G.aim+Math.PI/2);
    if(G.muzzle>0){ctx.globalAlpha=G.muzzle;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-32,6+8*(1-G.muzzle),0,6.28);ctx.fill();ctx.globalAlpha=1}
    if(C.glow){ctx.shadowColor=c;ctx.shadowBlur=12}
    ctx.fillStyle=C.lblBg;ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.rect(-8,-14,16,30);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=c;ctx.fillRect(-6.5,-6,13,20);ctx.fillStyle=C.ink;ctx.fillRect(-11,15,22,3);ctx.fillRect(-2,18,4,8);
    for(let i=0;i<3;i++)ctx.fillRect(-8,-8+i*7,4,1.2);
    ctx.beginPath();ctx.moveTo(-1.2,-14);ctx.lineTo(0,-30);ctx.lineTo(1.2,-14);ctx.fill();ctx.restore()}
  if(G.hurt>0){const g=ctx.createLinearGradient(0,H,0,H*.5);g.addColorStop(0,C.danger);g.addColorStop(1,'transparent');ctx.globalAlpha=Math.min(.4,G.hurt*.7);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
}

  <div class="chapters">${CH_KEYS.map(ch=>{const c=CHAPTERS[ch],mic=new Set(),dr=new Set();LEVELS.filter(L=>L.ch===ch).forEach(L=>{L.mic.forEach(t=>mic.add(t));L.wpn.forEach(w=>dr.add(w))});
    return `<button class="chap" data-act="chapter" data-ch="${ch}" style="--c:var(--${CH_SW[ch]})"><span class="chap-n">${c.name}</span><span class="chap-d">${c.blurb}</span><span class="chap-m">${c.count} rounds · ${mic.size} microbes · ${dr.size} drugs</span></button>`}).join('')}</div>
  <dl class="rules"><dt class="c-ok">★ +15</dt><dd>First-line drug. Three in a row raises your combo, up to ×3.</dd>
  <dt class="c-warn">✓ +5</dt><dd>The drug works, but a narrower or preferred one exists.</dd>
  <dt class="c-bad">✗ −10</dt><dd>Wrong drug. The microbe is resistant.</dd>
  <dt class="c-bad">−5</dt><dd>A microbe reaches the bloodstream and your patient’s vitals drop.</dd>
  <dt class="c-warn">C. diff</dt><dd>In the bacteria chapter, broad drugs fill the risk meter. At 100%, C. diff strikes.</dd></dl>
  <p class="fine">The last rounds of each chapter add a patient condition that rules out a drug.</p>
  <div class="btns"><button class="btn ghost" data-act="rounds">Jump to any round</button><button class="btn ghost" data-act="home">Back</button></div>`);
}
function showRounds(){
  show(showRounds,`<p class="eyebrow">All rounds</p><h2>Jump to a round</h2>
  ${CH_KEYS.map(ch=>`<h3>${CHAPTERS[ch].name}</h3><div class="rounds">${LEVELS.map((L,i)=>L.ch!==ch?'':`<button data-act="pick" data-lv="${i}" class="${L.mod?'mod':''}" aria-label="${CHAPTERS[ch].name} round ${L.idx+1}: ${L.name}">${L.idx+1}</button>`).join('')}</div>`).join('')}
  <p class="fine">Red-edged rounds have a patient condition. Starting a round resets your score to 0.</p>
  <div class="btns"><button class="btn ghost" data-act="multi">Back</button></div>`);
}
function showIntro(lv){
  if(LEVELS[lv].spec)return showSpecIntro();
  G.phase='menu';G.lv=lv;const L=LEVELS[lv],first=CHAPTERS[L.ch].firstMod===lv;
  if(first)G.lessons.set('mods','<b>From here on</b>, each patient has a condition that rules out a drug. A contraindicated drug costs −15 even if it would work.');
  show(()=>showIntro(lv),`<p class="eyebrow">${rl(lv)}</p><h2>${L.name}</h2><p>${L.vig}</p>
  ${L.mod?`<h3>Patient</h3><p class="ptcard"><b>${L.mod.label}.</b> ${L.mod.detail}${first?' From this round on, a drug this patient shouldn’t get costs −15.':''}</p>`:''}
  <h3>On the slide</h3><div class="mics">${L.mic.map(t=>`<div class="mic"><canvas data-m="${t}" aria-hidden="true"></canvas><div><b>${MIC[t].short}</b><small>${KIND[MIC[t].kind]}</small></div></div>`).join('')}</div>
  <h3>Your drugs</h3><ul class="drugs">${L.wpn.map(w=>`<li><b>${WPN[w].full||WPN[w].name}</b> <span class="wt">${WPN[w].tag}</span><br>${WPN[w].scope}</li>`).join('')}</ul>
  ${chartHTML(lv)}
  <div class="btns"><button class="btn" data-act="begin">Start round ${L.idx+1}</button><button class="btn ghost" data-act="chart">Show coverage chart</button></div>
  <p class="fine">Cure ${L.q} microbes. Speed goes up as you go.</p>`);
}
function showClear(){
  G.phase='menu';const nx=LEVELS[G.lv+1],next=Math.min(100,G.health+35);
  show(showClear,`<p class="eyebrow">${rl(G.lv)} cleared</p><h2>Infection controlled</h2>${statsHTML(G.ls,G.score)}${reviewHTML(3)}
  <p class="fine">Vitals recover to ${Math.round(next)}% before the next round.</p>
  <div class="btns"><button class="btn" data-act="next">Next: ${nx.name}</button></div>`);
}
function grade(){const p=pct(G.ts);return p>=85?'A':p>=70?'B':p>=55?'C':'D'}
function showOver(){
  G.phase='over';
  show(showOver,`<p class="eyebrow">${rl(G.lv)}: ${LEVELS[G.lv].name}</p><h2 class="c-bad">Patient crashed</h2>
  <p>Too many microbes reached the bloodstream. Look over the misses, then try again.</p>${statsHTML(G.ts,G.score)}${reviewHTML(5)}
  <div class="btns"><button class="btn" data-act="retry">Retry this round</button><button class="btn ghost" data-act="restart">Restart the chapter</button><button class="btn ghost" data-act="home">Main menu</button>${fbBtn()}</div>`);
}
function showWin(){
  G.phase='over';const g=grade(),ch=LEVELS[G.lv].ch,nx=CH_KEYS[CH_KEYS.indexOf(ch)+1];
  show(showWin,`<p class="eyebrow">${CHAPTERS[ch].name} chapter complete</p><h2 class="c-ok">Patients discharged</h2>
  <div style="display:flex;align-items:center;gap:16px"><span class="grade">${g}</span><p>Stewardship grade, based on how often you chose the first-line drug.</p></div>
  ${statsHTML(G.ts,G.score)}${reviewHTML(6)}
  <p class="fine">${G.score>=bestScore?'New best score.':`Best score ${bestScore}.`}</p>
  <div class="btns">${nx?`<button class="btn" data-act="chapter" data-ch="${nx}">Next chapter: ${CHAPTERS[nx].name}</button>`:''}<button class="btn${nx?' ghost':''}" data-act="restart">Replay ${CHAPTERS[ch].name}</button><button class="btn ghost" data-act="home">Main menu</button>${fbBtn()}</div>`);
}
function showPause(){
  show(showPause,`<p class="eyebrow">${rl(G.lv)}: ${LEVELS[G.lv].name}</p><h2>Paused</h2>${chartHTML(G.lv,1)}
  <div class="btns"><button class="btn" data-act="resume">Resume</button><div class="btn-row">${musicBtn()}${soundBtn()}</div>${fbBtn()}<button class="btn ghost" data-act="askRestart">Restart</button></div>`)}
function pause(){if(G.phase!=='play')return;G.phase='paused';showPause()}
function resume(){G.phase='play';G.last=null;hideOverlay()}
function askRestart(){const was=G.phase;if(was==='play')G.phase='paused';G.prev=was;
  show(askRestart,(LEVELS[G.lv].spec?`<h2>Start over with ${WPN[LEVELS[G.lv].drug].name}?</h2><p>Your score resets to 0.</p>`:`<h2>Restart this chapter?</h2><p>You go back to round 1 of the chapter and your score resets to 0.</p>`)+`<div class="btns"><button class="btn" data-act="restart">Restart</button><button class="btn ghost" data-act="${was==='play'||was==='paused'?'resume':'close'}">Keep playing</button></div>`)}
function resetRun(lv){G.score=0;G.health=100;G.ts=newStats();G.lessons=new Map();G.maxLv=lv;showIntro(lv)}

/* ---------- Single-drug mode: one drug loaded, a slide mixing microbes it does and doesn't cover ---------- */
const SPEC_IX=LEVELS.length;
LEVELS.push({ch:'spec',name:'',vig:'',mic:[],wpn:[],idx:0,sp:.075,iv:1.55,q:15,spec:1,cov:[],dec:[],covAll:[]});
CHAPTERS.spec={name:'Single-drug mode',count:1,first:SPEC_IX,last:SPEC_IX};
const chOf=t=>CH_KEYS.find(ch=>KIND_CH[ch].includes(MIC[t].kind));
// a drug belongs to the chapter where most of what it covers lives
function drugChapter(w){const n={};WPN[w].covers.forEach(t=>{const c=chOf(t);n[c]=(n[c]||0)+1});return Object.keys(n).sort((a,b)=>n[b]-n[a])[0]}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeSpec(w){
  const ch=drugChapter(w),pool=Object.keys(MIC).filter(t=>chOf(t)===ch),covAll=pool.filter(t=>covers(w,t));
  const cov=shuffle([...covAll]).slice(0,8);
  // decoys: microbes that share a round with this drug first, then look-alikes of what it covers, then the rest of the chapter
  const together=new Set();LEVELS.forEach(L=>{if(!L.spec&&L.wpn.includes(w))L.mic.forEach(t=>together.add(t))});
  const kinds=new Set(cov.map(t=>MIC[t].kind)),rank=t=>(together.has(t)?0:kinds.has(MIC[t].kind)?1:2)+Math.random()*.9;
  const dec=pool.filter(t=>!covers(w,t)).sort((a,b)=>rank(a)-rank(b)).slice(0,Math.max(4,Math.min(8,cov.length+2)));
  Object.assign(LEVELS[SPEC_IX],{name:WPN[w].name,drug:w,dch:ch,cov,dec,covAll,mic:[...cov,...dec],wpn:[w],
    vig:`Only ${WPN[w].name} is loaded. Shoot the microbes it kills and let the resistant ones drift past.`});
}
function showDrugs(){
  G.phase='menu';
  show(showDrugs,`<p class="eyebrow">Single-drug mode</p><h2>Pick your drug</h2>
  <p>One drug, a slide full of microbes. Shoot only what it kills. Hitting a resistant microbe costs points.</p>
  <div class="form"><label for="drugSearch">Search drugs<input id="drugSearch" type="search" placeholder="Name or class, like azole or macrolide" autocomplete="off"></label></div>
  <div class="btns"><button class="btn" data-act="specrand">Random drug</button></div>
  ${CH_KEYS.map(ch=>{const ws=Object.keys(WPN).filter(w=>drugChapter(w)===ch);
    return `<h3>${CHAPTERS[ch].drugs}</h3><div class="drugpick">${ws.map(w=>`<button class="dchip" data-act="specpick" data-w="${w}" data-q="${(WPN[w].name+' '+(WPN[w].full||'')+' '+WPN[w].tag).toLowerCase()}" style="--dc:${wcol(w)}"><b>${WPN[w].name}</b><small>${WPN[w].tag}</small></button>`).join('')}</div>`}).join('')}
  <p class="fine" id="drugNone" hidden>No drug matches that search.</p>
  <div class="btns"><button class="btn ghost" data-act="home">Back</button></div>`);
}
card.addEventListener('input',e=>{if(e.target.id!=='drugSearch')return;const q=e.target.value.trim().toLowerCase();let any=0;
  card.querySelectorAll('.drugpick').forEach(g=>{let n=0;g.querySelectorAll('.dchip').forEach(c=>{const ok=!q||c.dataset.q.includes(q);c.hidden=!ok;if(ok)n++});g.hidden=!n;g.previousElementSibling.hidden=!n;any+=n});
  $('#drugNone').hidden=!!any});
function showSpecIntro(){
  G.phase='menu';G.lv=SPEC_IX;const L=LEVELS[SPEC_IX],W=WPN[L.drug];
  show(showSpecIntro,`<p class="eyebrow">Single-drug mode · ${CHAPTERS[L.dch].name}</p><h2>${W.full||W.name}</h2>
  <p><span class="wt">${W.tag}</span></p><p>${W.scope}</p>
  <h3>On the slide</h3><p class="fine">Some of these are covered and some are resistant. Shoot only the ones ${W.name} kills.</p>
  <div class="mics">${shuffle([...L.mic]).map(t=>`<div class="mic"><canvas data-m="${t}" aria-hidden="true"></canvas><div><b>${MIC[t].short}</b><small>${KIND[MIC[t].kind]}</small></div></div>`).join('')}</div>
  ${chartHTML(SPEC_IX)}
  <div class="btns"><button class="btn" data-act="begin">Start</button><button class="btn ghost" data-act="chart">Show coverage chart</button><button class="btn ghost" data-act="specdrugs">Pick a different drug</button></div>
  <p class="fine">Cure ${L.q} covered microbes. A resistant hit costs 10 points. A covered microbe that escapes hurts the patient.</p>`);
}
function showSpecEnd(won){
  G.phase='over';const L=LEVELS[SPEC_IX],w=L.drug,W=WPN[w],s=G.ls,n=s.best+s.works+s.wrong,acc=n?Math.round((s.best+s.works)/n*100):0;
  show(()=>showSpecEnd(won),`<p class="eyebrow">Single-drug mode · ${W.name}</p><h2 class="${won?'c-ok':'c-bad'}">${won?'Spectrum mastered':'Patient crashed'}</h2>
  <div class="stats"><div><span class="lbl">Score</span><b>${G.score}</b></div><div><span class="lbl">Accuracy</span><b>${acc}%</b></div><div><span class="lbl">Resistant hits</span><b>${s.wrong}</b></div><div><span class="lbl">Escaped</span><b>${s.esc}</b></div></div>
  <h3>${W.name} covers</h3><p>${L.covAll.map(t=>(MIC[t].best.includes(w)?'★ ':'')+MIC[t].short).join(', ')}</p>
  <h3>Resistant on this slide</h3><p>${L.dec.map(t=>MIC[t].short).join(', ')}</p>
  <p class="fine">★ marks microbes where ${W.name} is first-line.</p>${reviewHTML(4)}
  <div class="btns"><button class="btn" data-act="specagain">Play ${W.name} again</button><button class="btn ghost" data-act="specdrugs">Pick another drug</button><button class="btn ghost" data-act="home">Main menu</button>${fbBtn()}</div>`);
}

/* ---------- Feedback: saved to the artifact's database when this viewer may write, otherwise copied out ---------- */
const FB={db:null,user:null,can:null};
(async()=>{try{if(!window.claude?.use)return;const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);FB.db=db;FB.user=user;
  if(user)FB.can=await user.can('data.write')}catch(e){}})();
const fbState={rating:0,back:null};
function showFeedback(){
  if(G.card!==showFeedback&&G.card!==showFeedbackCopy)fbState.back=G.card;
  show(showFeedback,`<p class="eyebrow">Help improve Antibiose</p><h2>Send feedback</h2>
  <form class="form" id="fbForm">
    <div><span class="lbl">Overall rating</span><div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${n} star${n>1?'s':''}" aria-pressed="${n<=fbState.rating}" class="${n<=fbState.rating?'on':''}">★</button>`).join('')}</div></div>
    <label for="fbRole">Your background<select id="fbRole"><option value="">Choose one</option><option>Medical student</option><option>Resident or physician</option><option>Nurse, PA or NP</option><option>Pharmacist or pharmacy student</option><option>Other health professional</option><option>Not in healthcare</option></select></label>
    <label for="fbGood">What worked well?<textarea id="fbGood" maxlength="1000"></textarea></label>
    <label for="fbBad">What was confusing, wrong or hard to read?<textarea id="fbBad" maxlength="1000" placeholder="Say which round or microbe if you can"></textarea></label>
    <label for="fbName">Name (optional)<input id="fbName" maxlength="80" autocomplete="name"></label>
    <p class="fine" id="fbMsg" aria-live="polite"></p>
    <div class="btns"><button class="btn" type="submit" id="fbSend">Send feedback</button><button class="btn ghost" type="button" data-act="fbBack">Cancel</button></div>
  </form>`);
}
function fbEntry(){
  return {rating:fbState.rating,role:$('#fbRole').value,good:$('#fbGood').value.trim(),bad:$('#fbBad').value.trim(),name:$('#fbName').value.trim(),
    chapter:CHAPTERS[LEVELS[G.lv].ch].name,round:LEVELS[G.lv].idx+1,roundName:LEVELS[G.lv].name,score:G.score,firstLinePct:pct(G.ts||newStats()),screen:`${innerWidth}x${innerHeight}`,at:new Date().toISOString()}}
function fbText(e){return `Antibiose feedback\nRating: ${e.rating||'-'}/5\nBackground: ${e.role||'-'}\nWorked well: ${e.good||'-'}\nConfusing or wrong: ${e.bad||'-'}\nName: ${e.name||'-'}\n${e.chapter} round ${e.round} (${e.roundName}), score ${e.score}, screen ${e.screen}`}
async function sendFeedback(){
  const msg=$('#fbMsg'),btn=$('#fbSend'),e=fbEntry();
  if(!e.rating&&!e.good&&!e.bad){msg.textContent='Add a rating or a comment first.';msg.className='fine c-bad';return}
  btn.disabled=true;msg.className='fine';msg.textContent='Sending…';
  try{
    if(!FB.db||!FB.user||FB.can===false)throw 0;
    const id=await FB.user.id();if(!id)throw 0;
    const ref=FB.db.doc('feedback/'+id),snap=await ref.get(),prev=snap.exists?{...snap.data()}:{},entries={...(prev.entries||{})};
    entries['e'+Date.now()]=e;const keys=Object.keys(entries).sort();while(keys.length>20)delete entries[keys.shift()];
    await ref.set({entries,updatedAt:e.at});
    fbState.rating=0;
    show(showFeedback,`<p class="eyebrow">Feedback</p><h2 class="c-ok">Thanks, it’s sent</h2><p>Your notes went straight to the person who shared this game.</p>
      <div class="btns"><button class="btn" data-act="fbBack">Back to the game</button></div>`);
  }catch(err){fbState.copy=fbText(e);showFeedbackCopy()}
}
function showFeedbackCopy(){
  show(showFeedbackCopy,`<p class="eyebrow">Feedback</p><h2>Copy and send it</h2>
  <p>This page can’t save feedback directly. Copy your notes and send them to the AI Medicine Collective, for example as a message to @aimedicinecollective on Instagram.</p>
  <div class="form"><label for="fbCopy">Your feedback<textarea id="fbCopy" class="copybox" readonly>${fbState.copy.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea></label></div>
  <p class="fine" id="fbMsg" aria-live="polite"></p>
  <div class="btns"><button class="btn" data-act="fbCopy">Copy feedback</button><button class="btn ghost" data-act="fbBack">Back to the game</button></div>`);
}
card.addEventListener('submit',e=>{if(e.target.id==='fbForm'){e.preventDefault();sendFeedback()}});

card.addEventListener('click',e=>{
  const star=e.target.closest('[data-star]');if(star){fbState.rating=+star.dataset.star;card.querySelectorAll('[data-star]').forEach(s=>{const on=+s.dataset.star<=fbState.rating;s.classList.toggle('on',on);s.setAttribute('aria-pressed',on)});return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='chapter')resetRun(CHAPTERS[b.dataset.ch].first);
  else if(a==='restart')resetRun(CHAPTERS[LEVELS[G.lv].ch].first);
  else if(a==='rounds')showRounds();
  else if(a==='pick')resetRun(+b.dataset.lv);
  else if(a==='specmode'||a==='specdrugs')showDrugs();
  else if(a==='multi')showMulti();
  else if(a==='howto')showHowTo();
  else if(a==='music'){MUS.on=!MUS.on;store.set('antibiose-music',MUS.on?'on':'off');b.textContent=`Music: ${MUS.on?'on':'off'}`;MUS.on?musStart():musStop();musUI()}
  else if(a==='specpick'){makeSpec(b.dataset.w);resetRun(SPEC_IX)}
  else if(a==='specrand'){const ks=Object.keys(WPN);makeSpec(ks[Math.random()*ks.length|0]);resetRun(SPEC_IX)}
  else if(a==='specagain'){makeSpec(LEVELS[SPEC_IX].drug);resetRun(SPEC_IX)}
  else if(a==='home')showStart();
  else if(a==='begin')startLevel(G.lv);
  else if(a==='next'){G.health=Math.min(100,G.health+35);showIntro(G.lv+1)}
  else if(a==='retry'){G.score=G.lvStart;G.health=100;startLevel(G.lv)}
  else if(a==='resume')resume();
  else if(a==='close'){G.prev==='menu'?showStart():hideOverlay()}
  else if(a==='askRestart')askRestart();
  else if(a==='feedback')showFeedback();
  else if(a==='fbBack'){(fbState.back||showStart)()}
  else if(a==='fbCopy'){const t=$('#fbCopy'),m=$('#fbMsg');const done=()=>{m.textContent='Copied. Paste it into a text or email.';m.className='fine c-ok'};
    try{navigator.clipboard.writeText(fbState.copy).then(done,()=>{t.focus();t.select();m.textContent='Select the text above and copy it.'})}catch(err){t.focus();t.select();m.textContent='Select the text above and copy it.'}}
  else if(a==='chart'){const c=$('#chart'),k=$('#chartKey');c.hidden=!c.hidden;k.hidden=c.hidden;b.textContent=c.hidden?'Show coverage chart':'Hide coverage chart'}
  else if(a==='sound'){sound=!sound;store.set('antibiose-sound',sound?'on':'off');b.textContent=`Effects: ${sound?'on':'off'}`;beep(660,.06,'triangle',.03)}
});
$('#btnPause').addEventListener('click',()=>G.phase==='play'?pause():G.phase==='paused'&&resume());
$('#btnRestart').addEventListener('click',()=>{if(G.phase==='play'||G.phase==='paused')askRestart();else resetRun(CHAPTERS[LEVELS[G.lv].ch].first)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();musStop()}else musStart()});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(G.phase==='play'&&/^[1-6]$/.test(e.key)){const w=LEVELS[G.lv].wpn[+e.key-1];w&&selectW(w)}
  else if(e.key==='Escape'||e.key==='p'){G.phase==='play'?pause():G.phase==='paused'&&resume()}
});

/* ---------- Boot ---------- */
function boot(){
  G.ts=newStats();G.ls=newStats();resize();readColors();G.w=LEVELS[0].wpn[0];buildWeapons();hud();
  // attract-mode microbes drifting behind the start card
  ['spy','mrsa','eco','flu','can','tpa','gla','hiv'].forEach((t,i)=>G.mobs.push({t,x0:(.15+(i*.37)%0.7)*W,x:0,y:(i/8)*ESC,v:H*.05,amp:12,fr:.7,ph:i,rot:i,spin:.2,shake:0,flash:0,dead:0,die:0}));
  showStart();requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{rebuild();renderMicChips();buildWeapons();const p=el.lesson.firstChild;p&&fit(p,13.5,10.5)});
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot();
})();
</script>
