<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url("../fonts/inter.woff2") format("woff2")}
[hidden]{display:none!important}
/* Layout: one-screen arcade cabinet. Portrait = arena on top, big touch pad below. Landscape touch = pad floats over the arena. */
:root{
  --bg:#081315;        /* scrub-room dark */
  --panel:#10252a;
  --line:#1f4148;
  --ink:#e9f6f2;
  --mute:#89aaa5;
  --code:#ff3b4f;      /* code red */
  --mint:#3fd6b4;      /* scrub mint */
  --amber:#ffc23d;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Inter","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box;position:relative}
#top{display:flex;align-items:center;gap:8px;padding-block:6px;flex:0 0 auto}
#top .brand{font-family:var(--display);font-size:15px;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand b{color:var(--code);font-weight:400}
.ib{text-decoration:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;height:38px;min-width:44px;padding:0 10px;font:700 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#view{flex:0 0 auto;display:flex;justify-content:center;position:relative}
#cv{display:block;border-radius:8px;background:#000;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.5)}
#keys{flex:0 0 auto;color:var(--mute);font-size:12.5px;text-align:center;padding-block:8px;line-height:1.6}
#keys kbd{font:700 11px var(--body);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
/* touch pad */
#pad{flex:1 1 auto;display:none;grid-template-columns:1fr 1fr;gap:12px;padding-block:10px;min-height:0;touch-action:none}
body.touch #pad{display:grid}
body.touch #keys{display:none}
.dpad{position:relative;align-self:center;justify-self:center;width:min(44vw,230px,34vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--panel) 30%,#0c1d21 70%);border:2px solid var(--line);touch-action:none}
.dpad i{position:absolute;width:34%;height:34%;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--mute);font-size:22px;border-radius:12px;transition:background .05s}
.dpad i.on{background:var(--mint);color:#04211b}
.dpad .u{left:33%;top:2%}.dpad .d{left:33%;bottom:2%}.dpad .l{left:2%;top:33%}.dpad .r{right:2%;top:33%}
.acts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:10px;align-self:center;width:100%;max-width:270px;justify-self:center;max-height:100%}
.ab{border:0;border-radius:18px;min-height:clamp(62px,10vh,84px);font:400 14px var(--display);color:#06171a;touch-action:none;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ab small{font:700 10px var(--body);opacity:.7;margin-top:2px}
.ab.p{background:#ffd166}.ab.k{background:#5ad1ff}.ab.s{background:#b991ff}.ab.b{background:#a7b7b4}
.ab.on{filter:brightness(1.35);transform:scale(.96)}
.ab.s::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);transform-origin:left;transform:scaleX(var(--cd,0))}
.ab.f{grid-column:1/3;min-height:52px;background:#3a2328;color:#8f6b72;font-size:13px}
.ab.f.ready{background:var(--code);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px var(--code);transform:scale(1.03)}}
@media (orientation:landscape){
  body.touch #pad{position:absolute;inset:auto 0 0 0;padding:0 max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));pointer-events:none;align-items:end}
  body.touch #pad>*{pointer-events:auto;opacity:.78}
  body.touch .dpad{width:min(30vh,170px);justify-self:start}
  body.touch .acts{justify-self:end;max-width:200px}
  body.touch .ab{min-height:52px}
}
/* screens */
#ov{position:absolute;inset:0;z-index:5;overflow:auto;display:flex;justify-content:center;background:rgba(5,12,14,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#ov[hidden]{display:none!important}
.scr{width:100%;max-width:560px;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:stretch;margin:auto 0}
.logo{font-family:var(--display);text-align:center;line-height:.9;margin:8px 0 2px}
.logo .a{display:block;font-size:clamp(34px,11vw,64px);color:var(--ink);text-shadow:0 4px 0 #0f3a40}
.logo .b{display:block;font-size:clamp(40px,13.5vw,78px);color:var(--code);text-shadow:0 5px 0 #5a0d18,0 0 30px rgba(255,59,79,.45)}
.ecg{height:26px;width:100%}
.tag{text-align:center;color:var(--mute);margin:0 0 6px;font-size:15px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 0;text-wrap:balance;text-align:center}
.sub{color:var(--mute);text-align:center;margin:0;font-size:14px}
.btn{font:700 16px var(--body);border-radius:14px;min-height:54px;padding:10px 16px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;letter-spacing:.3px}
.btn.pri{background:var(--code);border-color:var(--code);color:#fff;font-family:var(--display);font-weight:400;font-size:18px}
.btn.alt{background:var(--mint);border-color:var(--mint);color:#04211b}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.75;font-family:var(--body)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.best{text-align:center;color:var(--amber);font:700 14px var(--body);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 2px 6px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font:700 12px var(--body)}
.card canvas{width:72px;height:72px}
.card.sel{border-color:var(--amber);background:#2a2410}
.card.opp{box-shadow:inset 0 0 0 2px var(--mint)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.info .nm{font-family:var(--display);font-size:18px}
.info .q{color:var(--mute);font-style:italic}
.info .mv b{color:var(--amber)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--mute)}
.stats span{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.stats span i{display:block;height:100%;background:var(--mint)}
.stage{display:flex;align-items:center;gap:8px}
.stage .btn{min-height:44px;flex:0 0 52px;padding:0}
.stage div{flex:1;text-align:center;font:700 15px var(--body)}
.stage div small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.big{font-family:var(--display);font-size:clamp(30px,9vw,48px);text-align:center;margin:0;line-height:1}
.big.win{color:var(--mint)}.big.lose{color:var(--code)}
.scorebox{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--panel);border-radius:12px;padding:12px 16px;font-variant-numeric:tabular-nums}
.scorebox b{text-align:right}
.code{font-family:var(--display);font-size:44px;text-align:center;letter-spacing:8px;color:var(--amber);margin:0}
input.codein{font:400 26px var(--display);text-align:center;letter-spacing:6px;text-transform:uppercase;background:#061012;color:var(--ink);border:2px solid var(--line);border-radius:12px;min-height:54px;width:100%;box-sizing:border-box}
.note{color:var(--mute);font-size:13px;text-align:center;margin:0;line-height:1.5}
.status{text-align:center;font-weight:700;margin:0}
.status.ok{color:var(--mint)}.status.wait{color:var(--amber)}
.howto{display:grid;gap:10px;font-size:14px;line-height:1.5}
.howto section{background:var(--panel);border-radius:12px;padding:10px 14px}
.howto h3{font:400 14px var(--display);margin:0 0 4px;color:var(--amber)}
.howto ul{margin:0;padding-left:18px}
@media (prefers-reduced-motion:reduce){.ab.f.ready{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">HOSPITAL <b>KOMBAT</b></div>

  </div>
  <div id="ov"></div>
</div>

function finalReady(F,O){return g.phase==='fight'&&O.hp>0&&O.hp<=CH[O.c].hp*.25&&F.st!=='ko'}

 ov.querySelector('[data-a=back]').onclick=menu;
}
function portrait(cnv,i){const c=cnv.getContext('2d'),d=2;cnv.width=72*d;cnv.height=72*d;c.scale(d*1.05,d*1.05);c.translate(-2,0);drawFighter(c,{c:i,x:36,y:66,face:1,st:'idle',t:0},0)}
function selectScreen(kind,opts={}){
 // kind: arcade | local1 | local2 | online
 screen='select';
 let cur=kind==='local2'?localSel[1]:kind==='online'?NET.ch:localSel[0];
 const title=kind==='arcade'?'Choose your specialty':kind==='local1'?'Player 1: choose':kind==='local2'?'Player 2: choose':'Choose your specialty';
 const sub=kind==='arcade'?'You will face the other 8, one at a time':kind==='online'?'':'Mirror matches allowed';
 show(`<div class="scr"><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}${kind==='online'?'<div id="netInfo"></div>':''}
  <div class="grid">${CH.map((C,i)=>`<button class="card" data-i="${i}" aria-label="${C.name}"><canvas></canvas><span>${C.name}</span></button>`).join('')}</div>
  <div class="info" id="info"></div>
  ${(kind!=='local2'&&kind!=='online')||(kind==='online'&&NET.role==='host')?`<div class="stage"><button class="btn" data-s="-1" aria-label="Previous stage">◀</button><div id="stg"></div><button class="btn" data-s="1" aria-label="Next stage">▶</button></div>`:''}
  <button class="btn pri" id="go">${kind==='arcade'?'Start arcade':kind==='local1'?'Next: Player 2':kind==='local2'?'Fight!':'Ready'}</button>
  <button class="btn ghost" id="back">Back</button></div>`);
 ov.querySelectorAll('.card').forEach(b=>portrait(b.querySelector('canvas'),+b.dataset.i));
 const upd=()=>{ov.querySelectorAll('.card').forEach(b=>{b.classList.toggle('sel',+b.dataset.i===cur);b.classList.toggle('opp',kind==='online'&&NET.oppCh!=null&&+b.dataset.i===NET.oppCh)});const C=CH[cur];
  $('#info').innerHTML=`<div class="nm">${C.name}</div><div class="q">“${C.q}”</div><div class="mv">Special: <b>${C.sp.n}</b></div><div class="mv">Final Procedure: <b>${C.fn}</b></div>
  <div class="stats">Power<span><i style="width:${(C.pow-.8)/.45*100}%"></i></span>Speed<span><i style="width:${(C.spd-.85)/.3*100}%"></i></span>Stamina<span><i style="width:${(C.hp-90)/25*100}%"></i></span></div>`;
  const s=$('#stg');if(s)s.innerHTML=`<small>Stage</small>${STAGES[stageSel]}`;
  if(kind==='online')netSelUpdate(cur)};
 ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;if(kind==='online'&&NET.ready)return;upd()});
 ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stageSel=(stageSel+ +b.dataset.s+5)%5;if(g&&g.mode==='demo'){g.stage=stageSel}upd()});
 $('#back').onclick=kind==='local2'?()=>selectScreen('local1'):kind==='online'?()=>{netLeave();onlineScreen()}:menu;
 $('#go').onclick=()=>{
  if(kind==='arcade'){localSel[0]=cur;startArcade(cur)}
  else if(kind==='local1'){localSel[0]=cur;selectScreen('local2')}
  else if(kind==='local2'){localSel[1]=cur;startLocal()}
  else{NET.ready=!NET.ready;netSelUpdate(cur);$('#go').textContent=NET.ready?'Not ready':'Ready'}
 };
 if(g&&g.mode==='demo')g.stage=stageSel;
 upd();
}
function startArcade(pc){
 const order=CH.map((_,i)=>i).filter(i=>i!==pc).sort(()=>Math.random()-.5);
 run={pc,order,lvl:0,score:0,stage0:stageSel};arcadeFight();
}
function arcadeFight(){newMatch(run.pc,run.order[run.lvl],(run.stage0+run.lvl)%5,'arcade',{lvl:run.lvl,score:run.score});AI[1]={k:0,next:30};fightScreen()}
function startLocal(){newMatch(localSel[0],localSel[1],stageSel,'local');fightScreen()}
function fightScreen(){screen='fight';paused=false;hide();resize();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
let shownOver=-1;
function results(){
 const w=g.wins[0]>=2?0:1,C0=CH[g.f[0].c],C1=CH[g.f[1].c],Wc=CH[g.f[w].c];
 screen='results';
 if(g.mode==='arcade'){
  run.score=g.score;
  if(w===0){run.score+=1500*(run.lvl+1);run.lvl++;const champ=run.lvl>=run.order.length;if(run.score>best){best=run.score;store.set('hk_best',best)}
   const nx=champ?null:CH[run.order[run.lvl]];
   show(`<div class="scr"><p class="big win">${champ?'CHIEF OF STAFF':'VICTORY'}</p><p class="sub">“${C0.q}”</p>
    <div class="scorebox"><span>Patients beaten</span><b>${run.lvl} / 8</b><span>Match bonus</span><b>+${(1500*run.lvl).toLocaleString()}</b><span>Score</span><b>${run.score.toLocaleString()}</b><span>Best</span><b>${best.toLocaleString()}</b></div>
    ${champ?'<p class="note">You beat every specialty. The whole hospital answers to you now.</p>':`<p class="note">Next up: <b>${nx.name}</b> in the ${STAGES[(run.stage0+run.lvl)%5]}. They hit harder and react faster.</p>`}
    <button class="btn pri" id="a1">${champ?'Play again':'Next opponent'}</button><button class="btn" id="a2">Change fighter</button><button class="btn ghost" id="a3">Main menu</button></div>`);
   $('#a1').onclick=champ?()=>startArcade(run.pc):arcadeFight;
  }else{if(run.score>best){best=run.score;store.set('hk_best',best)}
   show(`<div class="scr"><p class="big lose">CODE BLUE</p><p class="sub">${C1.name}: “${C1.q}”</p>
    <div class="scorebox"><span>Patients beaten</span><b>${run.lvl} / 8</b><span>Final score</span><b>${run.score.toLocaleString()}</b><span>Best</span><b>${best.toLocaleString()}</b></div>
    <button class="btn pri" id="a1">Restart run</button><button class="btn" id="a2">Change fighter</button><button class="btn ghost" id="a3">Main menu</button></div>`);
   $('#a1').onclick=()=>startArcade(run.pc);
  }
  $('#a2').onclick=()=>selectScreen('arcade');$('#a3').onclick=menu;
 }else if(g.mode==='local'){
  show(`<div class="scr"><p class="big win">PLAYER ${w+1} WINS</p><p class="sub">${Wc.name}: “${Wc.q}”</p>
   <button class="btn pri" id="a1">Rematch</button><button class="btn" id="a2">Change fighters</button><button class="btn ghost" id="a3">Main menu</button></div>`);
  $('#a1').onclick=startLocal;$('#a2').onclick=()=>selectScreen('local1');$('#a3').onclick=menu;
 }else{
  const won=w===me();
  show(`<div class="scr"><p class="big ${won?'win':'lose'}">${won?'YOU WIN':'YOU LOSE'}</p><p class="sub">${Wc.name}: “${Wc.q}”</p>
   <p class="status wait" id="rmS">Rematch? Both players tap it.</p>
   <button class="btn pri" id="a1">Rematch</button><button class="btn" id="a2">Change fighters</button><button class="btn ghost" id="a3">Leave</button></div>`);
  $('#a1').onclick=()=>{NET.rm=g.mid;NET.nr&&NET.nr.presence({rm:g.mid}).catch(()=>{});$('#rmS').textContent='Waiting for your rival…'};
  $('#a2').onclick=()=>{NET.ready=false;NET.nr&&NET.nr.presence({rdy:false,s:null,rm:null}).catch(()=>{});g=null;startDemo();selectScreen('online')};
  $('#a3').onclick=menu;
 }
}
function pauseMenu(){
 if(screen!=='fight'){if(screen!=='menu')menu();return}
 const online=g.mode==='host'||g.mode==='guest';paused=!online;
 show(`<div class="scr"><h2>${online?'Match menu':'Paused'}</h2>
 <button class="btn pri" id="p1">Resume</button>
 ${online?'':'<button class="btn" id="p2">Restart match</button>'}
 <button class="btn ghost" id="p3">${online?'Leave match':'Quit to menu'}</button></div>`);
 $('#p1').onclick=()=>{paused=false;screen='fight';hide()};
 screen='paused';
 const p2=$('#p2');if(p2)p2.onclick=()=>{if(g.mode==='arcade')arcadeFight();else startLocal()};
 $('#p3').onclick=menu;
}
$('#menuBtn').onclick=pauseMenu;
addEventListener('keydown',e=>{if(e.code==='Escape'){if(screen==='fight')pauseMenu();else if(screen==='paused'){paused=false;screen='fight';hide()}}});

/* ---------------- online (room capability) ---------------- */
let roomNS=null,roomTried=false;
try{if(window.claude&&claude.use)claude.use('room').then(r=>{roomNS=r;roomTried=true;if(screen==='online')onlineScreen()}).catch(()=>{roomTried=true});else roomTried=true}catch(e){roomTried=true}
const NET={nr:null,role:null,code:'',ch:0,ready:false,oppCh:null,unsub:[],rm:null,lastEv:0,inKey:'',joinedAt:0};
function oppPeer(){if(!NET.nr)return null;const want=NET.role==='host'?'guest':'host';return NET.nr.peers().find(p=>!p.sameTab&&p.presence&&p.presence.role===want)||null}
function onlineScreen(){
 screen='online';
 if(!roomNS){show(`<div class="scr"><h2>Online vs a friend</h2>
  <p class="note">${roomTried?'Online play needs the game opened from its Claude link while signed in. Share the artifact with your friend, then both of you open it, choose Online, and one of you creates a game.':'Connecting…'}</p>
  <p class="note">Meanwhile, Arcade and Same keyboard work anywhere.</p><button class="btn ghost" id="b">Back</button></div>`);$('#b').onclick=menu;return}
 show(`<div class="scr"><h2>Online vs a friend</h2><p class="note">Both players open this same link. One creates a game and shares the 4-letter code; the other joins with it.</p>
  <button class="btn pri" id="mk">Create a game</button>
  <div class="row"><input class="codein" id="cin" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button class="btn alt" id="jn">Join</button></div>
  <p class="status wait" id="err"></p><button class="btn ghost" id="b">Back</button></div>`);
 $('#b').onclick=menu;
 $('#mk').onclick=()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=A[(Math.random()*A.length)|0];netJoin(s,'host')};
 $('#jn').onclick=()=>{const s=($('#cin').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(s.length!==4){$('#err').textContent='Enter the 4-letter code from your friend.';return}netJoin(s,'guest')};
 $('#cin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#jn').click()});
}
async function netJoin(code,role){
 const e=$('#err');if(e)e.textContent='Connecting…';
 try{NET.nr=await roomNS.join('hk-'+code.toLowerCase())}catch(err){if(e)e.textContent='Could not connect ('+(err&&err.code||'error')+'). Try again in a moment.';return}
 NET.role=role;NET.code=code;NET.ready=false;NET.oppCh=null;NET.rm=null;NET.joinedAt=Date.now();NET.ch=localSel[0];
 NET.nr.presence({role,ch:NET.ch,rdy:false,s:null,rm:null,in:0,pc:[0,0,0,0]}).catch(()=>{});
 NET.unsub.push(NET.nr.onPeers(netPeers,()=>{}));
 selectScreen('online');
}
function netSelUpdate(cur){
 NET.ch=cur;if(NET.nr)NET.nr.presence({ch:cur,rdy:NET.ready}).catch(()=>{});
 const box=$('#netInfo');if(!box)return;const op=oppPeer();
 const full=NET.nr&&NET.nr.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.role===NET.role).length>0;
 box.innerHTML=`${NET.role==='host'?`<p class="sub">Game code. Send it to your friend:</p><p class="code">${NET.code}</p>`:`<p class="sub">Game ${NET.code}</p>`}
  <p class="status ${op?'ok':'wait'}">${full?'Someone else already took your seat in this game. Go back and use a new code.':op?`Rival connected: ${CH[op.presence.ch|0].name}${op.presence.rdy?' · READY':' · choosing…'}`:NET.role==='host'?'Waiting for your friend to join…':(Date.now()-NET.joinedAt>4000?'No game found with that code yet. Check it, or wait for your friend to create it.':'Looking for the game…')}</p>
  ${NET.ready?'<p class="note">You are ready. '+(NET.role==='host'?'The match starts when your rival is ready.':'Waiting for the host to start…')+'</p>':''}`;
}
function netPeers(){
 const op=oppPeer();NET.oppCh=op?op.presence.ch|0:null;
 if(screen==='select'&&NET.nr){ov.querySelectorAll('.card').forEach(b=>b.classList.toggle('opp',NET.oppCh!=null&&+b.dataset.i===NET.oppCh));netSelUpdate(NET.ch)}
 if(NET.role==='host'&&screen==='select'&&NET.ready&&op&&op.presence.rdy){ // start
  newMatch(NET.ch,op.presence.ch|0,stageSel,'host');fightScreen();
 }
 if((screen==='fight'||screen==='results'||screen==='paused')&&(g&&(g.mode==='host'||g.mode==='guest'))&&!op){
  screen='results';show(`<div class="scr"><p class="big lose">DISCONNECTED</p><p class="note">Your rival left the game.</p><button class="btn pri" id="a3">Main menu</button></div>`);$('#a3').onclick=menu;
 }
}
function netLeave(){for(const u of NET.unsub)try{u()}catch(e){}NET.unsub=[];if(NET.nr){try{NET.nr.leave()}catch(e){}}NET.nr=null;NET.role=null;NET.ready=false}
function encS(){const r=v=>Math.round(v*10)/10;return{m:g.mid,p:g.phase,pt:g.phaseT,r:g.round,w:g.wins,tm:g.timer,wn:g.win,to:g.tout,pf:g.perfect,sg:g.stage,sk:g.shake,T:g.T,
 f:g.f.map(F=>[F.c,r(F.x),r(F.y),F.face,r(F.hp),F.st,F.atk||0,F.t,F.frz,F.slow,F.cd,F.inv,F.kd,F.crouchB?1:0,F.usedAir]),
 pr:g.proj.map(p=>[r(p.x),r(p.y),p.c,p.t,p.d]),fx:g.fx.map(e=>[r(e.x),r(e.y),e.t,e.k]),fn:g.fin?[g.fin.by,g.fin.t]:0,cm:g.cmb?[g.cmb.i,g.cmb.n,g.cmb.t]:0,ev:g.evs}}
function decS(s){
 const F=a=>({c:a[0],x:a[1],y:a[2],face:a[3],hp:a[4],st:a[5],atk:a[6]||null,t:a[7],frz:a[8],slow:a[9],cd:a[10],inv:a[11],kd:a[12],crouchB:a[13],usedAir:a[14],combo:0});
 const old=g&&g.mode==='guest'?g:null;
 g={mode:'guest',mid:s.m,phase:s.p,phaseT:s.pt,round:s.r,wins:s.w,timer:s.tm,win:s.wn,tout:s.to,perfect:s.pf,stage:s.sg,shake:s.sk,T:s.T,f:s.f.map(F),
  proj:s.pr.map(p=>({x:p[0],y:p[1],c:p[2],t:p[3],d:p[4],vx:p[4]})),fx:s.fx.map(e=>({x:e[0],y:e[1],t:e[2],k:e[3]})),fin:s.fn?{by:s.fn[0],t:s.fn[1]}:null,cmb:s.cm?{i:s.cm[0],n:s.cm[1],t:s.cm[2]}:null,evs:s.ev||[],rshake:old?old.rshake:0,lvl:0,score:0};
 for(const [id,n] of g.evs)if(id>NET.lastEv){NET.lastEv=id;sfx(n)}
}
let lastGuestIn='';
function netTick(){
 if(!NET.nr)return;
 if(NET.role==='host'&&g&&g.mode==='host'){
  const op=oppPeer();if(op){const pr=op.presence,bits=pr.in|0,pc=pr.pc||[0,0,0,0];const c=ctl[1];c.h={l:bits&1,r:bits>>1&1,u:bits>>2&1,d:bits>>3&1,b:bits>>4&1};c.pc={p:pc[0]|0,k:pc[1]|0,s:pc[2]|0,f:pc[3]|0};
   if(g.phase==='over'&&g.phaseT>100&&pr.rm===g.mid&&NET.rm===g.mid){NET.rm=null;NET.nr.presence({rm:null}).catch(()=>{});newMatch(g.f[0].c,g.f[1].c,g.stage,'host');fightScreen()}}
  NET.nr.presence({s:encS()}).catch(()=>{});
 }
 if(NET.role==='guest'){
  const c=ctl[1],bits=c.h.l|c.h.r<<1|c.h.u<<2|c.h.d<<3|c.h.b<<4,pc=[c.pc.p,c.pc.k,c.pc.s,c.pc.f],key=bits+'|'+pc.join(',');
  if(key!==lastGuestIn){lastGuestIn=key;NET.nr.presence({in:bits,pc}).catch(()=>{})}
  const hp=oppPeer();const s=hp&&hp.presence.s;
  if(s&&s.m){
   if(screen==='select'&&NET.ready){NET.lastEv=0;decS(s);fightScreen()}
   else if(screen==='results'&&g&&s.m!==g.mid){NET.rm=null;NET.nr.presence({rm:null}).catch(()=>{});decS(s);fightScreen()}
   else if(screen==='fight'||screen==='paused'||screen==='results')decS(s);
  }
 }
}

/* ---------------- pad state & main loop ---------------- */
const finBtn=$('#finBtn'),spBtn=$('#spBtn');let lastFin=null,lastCd=-1;
function padUpdate(){if(!g||!isTouch)return;const i=me(),F=g.f[i],O=g.f[1-i];const r=screen==='fight'&&g.mode!=='demo'&&finalReady(F,O);if(r!==lastFin){finBtn.classList.toggle('ready',r);lastFin=r}
 const cd=Math.round((F.cd||0)/SPEC_CD*20)/20;if(cd!==lastCd){spBtn.style.setProperty('--cd',cd);lastCd=cd}}
function gather(){
 if(!g)return;
 if(g.mode==='local'){mergeInto(ctl[0],[local[0],local[2]]);mergeInto(ctl[1],[local[1]])}
 else if(g.mode==='guest')mergeInto(ctl[1],local);
 else if(g.mode!=='demo')mergeInto(ctl[0],local);
}
let last=performance.now(),acc=0;
function frame(ts){
 requestAnimationFrame(frame);
 acc+=Math.min(100,ts-last);last=ts;
 while(acc>=1000/60){acc-=1000/60;
  gather();
  if(g&&g.mode!=='guest'&&!paused&&(screen!=='results'||g.mode==='host'))sim();
  netTick();
  if(g&&g.mode!=='demo'&&g.mode!=='guest'&&screen==='fight'&&g.phase==='over'&&g.phaseT===110&&shownOver!==g.mid){shownOver=g.mid;results()}
  if(g&&g.mode==='guest'&&screen==='fight'&&g.phase==='over'&&g.phaseT>=110&&shownOver!==g.mid){shownOver=g.mid;results()}
 }
 render();padUpdate();
}
const fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
resize();menu();requestAnimationFrame(frame);fontsReady.then(()=>{if(screen==='select'||screen==='menu')ov.querySelectorAll('.card canvas').forEach((cn,i)=>portrait(cn,i))});
})();
</script>
