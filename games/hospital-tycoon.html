<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Tycoon – AI Medicine Collective</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Build a hospital floor by floor, hire specialists, balance RVUs and patient care, and survive five years of crises." />
  <meta name="theme-color" content="#0A7266" />
  <meta name="game-back" content="../games.html" />
  <link rel="apple-touch-icon" href="../images/icon-192.png" />
  <link rel="icon" type="image/png" href="../images/icon-192.png" />
  <meta property="og:site_name" content="AI Medicine Collective" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hospital Tycoon" />
  <meta property="og:description" content="Design the floors. Staff the units. Keep the RVUs flowing." />
  <meta property="og:image" content="https://www.aimedicinecollective.com/images/share-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Built from the Claude Artifact version of this game (source and build_site.py are kept outside this repo). This copy uses the site's own font, follows the site's theme switch and keeps scores on the device. -->
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("amc-theme")==="terminal"?"dark":"light")}catch(e){}</script>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 800;font-display:swap;src:url("../fonts/inter.woff2") format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: a drawn cutaway of your hospital tower (sky, roof sign, floors, street) between a compact HUD and thumb-reach tabs. Light theme is daytime, dark theme is night shift. */
:root{
  --bg:#E6EDEB; --panel:#FFFFFF; --panel2:#F1F6F4; --ink:#10201D; --muted:#556964; --line:#C4D3CF;
  --accent:#0A7266; --on-accent:#FFFFFF; --good:#1C8649; --warn:#B26F08; --bad:#C2322C; --shadow:rgba(12,38,34,.16);
  --ed:#CF3A33; --ms:#2D66C6; --icu:#7347C4; --or:#0C887C; --cath:#B4386F; --img:#C47C0E; --lab:#378B35; --ph:#63722A; --clin:#1B84A6; --ld:#C2509A; --cafe:#CC6228; --gard:#47815A;
  --cv-sky1:#8CC6E2; --cv-sky2:#DDF0F1; --cv-facade:#C3CDCA; --cv-wall:#EEF3F2; --cv-wall2:#DCE5E3; --cv-slab:#83928F; --cv-road:#4B5452; --cv-walk:#B7C1BE; --cv-glass:#B9E1EE; --cv-shaft:#56625F; --cv-night:0;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,-apple-system,sans-serif; --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --panel:#131D1B; --panel2:#18241F; --ink:#E0EBE8; --muted:#8DA29D; --line:#2A3B37;
  --accent:#2DB3A1; --on-accent:#05201B; --good:#43C27B; --warn:#E3A13A; --bad:#F05D54; --shadow:rgba(0,0,0,.45);
  --cv-sky1:#060D1C; --cv-sky2:#17283A; --cv-facade:#37433F; --cv-wall:#3E4A44; --cv-wall2:#323D39; --cv-slab:#55635F; --cv-road:#191E1D; --cv-walk:#363F3C; --cv-glass:#22394A; --cv-shaft:#1A2220; --cv-night:1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1311; --panel:#131D1B; --panel2:#18241F; --ink:#E0EBE8; --muted:#8DA29D; --line:#2A3B37;
  --accent:#2DB3A1; --on-accent:#05201B; --good:#43C27B; --warn:#E3A13A; --bad:#F05D54; --shadow:rgba(0,0,0,.45);
  --cv-sky1:#060D1C; --cv-sky2:#17283A; --cv-facade:#37433F; --cv-wall:#3E4A44; --cv-wall2:#323D39; --cv-slab:#55635F; --cv-road:#191E1D; --cv-walk:#363F3C; --cv-glass:#22394A; --cv-shaft:#1A2220; --cv-night:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-block:8px 0}

/* HUD */
#hud{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:grid;gap:7px;box-shadow:0 2px 10px var(--shadow)}
.r1{display:flex;align-items:center;gap:12px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .lbl{white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.15;white-space:nowrap}
#cash.neg{color:var(--bad)}
.ctrls{margin-left:auto;display:flex;gap:6px}
.cb{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:18px}
.cb svg{width:20px;height:20px;fill:currentColor}
.cb.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.r2{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center}
.stars{position:relative;display:inline-block;font-size:17px;letter-spacing:1px;color:var(--line);line-height:1}
.stars .on{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:var(--img)}
.meter{display:grid;gap:3px;min-width:0}
.meter span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.meter i{display:block;height:7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--accent);transition:width .5s}
.board{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:6px}
.board b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.board .ok{color:var(--good)} .board .no{color:var(--bad)}
.wk{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:-4px}
.wk b{display:block;height:100%;background:var(--accent);width:0}

#advisor{display:flex;gap:8px;align-items:center;text-align:left;border-radius:12px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.3;min-height:46px}
#advisor .tag{flex:none;font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--on-accent)}
#advisor.bad .tag{background:var(--bad);color:#fff}
#advisor.warn .tag{background:var(--warn);color:#fff}
#advisor .txt{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Tower */
#bldg{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border-radius:14px;border:1px solid var(--line);background:var(--cv-sky1);position:relative}
#tower{position:relative;width:100%}
#cv{display:block;width:100%}
#ov{position:absolute;inset:0}
.slot{position:absolute;background:transparent;border:0;border-radius:8px;padding:0}
.slot:active{background:rgba(255,255,255,.22)}
.addfl{position:absolute;left:50%;transform:translateX(-50%);border:2px dashed rgba(255,255,255,.75);background:rgba(10,30,40,.28);color:#fff;border-radius:12px;min-height:44px;padding:4px 16px;font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(2px)}
.addfl small{display:block;font-family:var(--f-num);font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500}
.addfl:disabled{opacity:.55}

/* Nav */
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding-bottom:8px}
#nav button{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 2px;min-width:0}
#nav button small{font-family:var(--f-body);font-weight:500;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.flt{position:absolute;font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--good);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:8px;animation:rise 1.2s ease-out forwards;white-space:nowrap}
.flt.neg{color:var(--bad)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);width:min(92vw,420px);display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px var(--shadow);animation:toast 3.6s ease forwards}
.toast .medal{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--img));color:#fff;font-family:var(--f-disp);font-weight:800;font-size:18px}
.toast b{display:block;font-size:15px}
.toast span{font-size:13px;color:var(--muted)}
.shake{animation:shake .45s}

/* Sheet + modal */
#scrim{position:fixed;inset:0;background:rgba(5,15,13,.45);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:84%;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line);box-shadow:0 -10px 30px var(--shadow);animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;min-width:0}
.sh-head .sub{font-size:13px;color:var(--muted)}
.sh-head button{margin-left:auto;flex:none;min-width:84px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
#shBody{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;min-height:0;user-select:text;-webkit-user-select:text}
#shBody>*{flex-shrink:0}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.opt{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;min-height:64px}
.opt:disabled{opacity:.45}
.chip{display:grid;place-items:center;height:54px;border-radius:9px;background:var(--c);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:19px}
.opt h3{margin:0;font-size:16px;font-weight:700}
.opt p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.opt .meta{font-family:var(--f-num);font-size:12px;color:var(--ink);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.row h3{margin:0;font-size:15px;font-weight:700}
.row p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.35}
.need{font-size:12.5px;font-weight:600;margin-top:3px}
.need.bad{color:var(--bad)} .need.ok{color:var(--good)} .need.warn{color:var(--warn)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:600;line-height:1}
.step button.plus,.hire{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.hire{min-height:48px;border-radius:12px;border:1px solid var(--accent);font-weight:700;padding:0 14px;font-size:15px}
.step button:disabled,.hire:disabled{opacity:.35}
.step .n{min-width:34px;text-align:center;font-family:var(--f-num);font-weight:600;font-size:18px}
.docs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.doc{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:4px 10px 4px 4px;min-height:40px;text-align:left;font-size:13px;line-height:1.15;max-width:100%}
.doc .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--c)}
.doc em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.doc.pend{opacity:.6;border-style:dashed}
.doc.star{border-color:var(--img);box-shadow:inset 0 0 0 1px var(--img)}
.doc.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.doc.armed em{color:#fff}
.cand{display:grid;grid-template-columns:44px 1fr;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.cand .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--c)}
.cand h3{margin:0;font-size:16px}
.cand p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.cand .tr{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.cand .tr.star{background:var(--img);color:#fff;border-color:var(--img)}
.cand .act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp{font-family:var(--f-disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:6px 0 -2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp .mb{flex:0 0 110px;height:7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.grp .mb b{display:block;height:100%}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);min-width:0}
.kpi span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:0}
tr.me td{background:var(--panel2);font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.note{font-size:13.5px;line-height:1.4;padding:8px 10px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--accent)}
.note.bad{border-left-color:var(--bad)} .note.warn{border-left-color:var(--warn)} .note.good{border-left-color:var(--good)}
.note .w{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-right:6px}
.quote{font-size:14px;line-height:1.35;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;max-width:92%}
.quote.bad{border-color:var(--bad)} .quote.good{border-color:var(--good)}
.quote small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;padding:8px 12px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.wide{grid-column:1/-1}
.scroll{overflow-x:auto}
.cert{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);display:grid;gap:6px}
.cert h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cert h3 span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.cert h3 span.on{background:var(--good);color:#fff;border-color:var(--good)}
.cert h3 span.lapsed{background:var(--warn);color:#fff;border-color:var(--warn)}
.cert p{margin:0;font-size:12.5px;color:var(--muted)}
.cert ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.cert li::before{content:"✗ ";color:var(--bad);font-weight:700}
.cert li.y::before{content:"✓ ";color:var(--good)}
.cert .pb{height:6px;border-radius:3px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.cert .pb b{display:block;height:100%;background:var(--good)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel2);font-size:12.5px;color:var(--muted);line-height:1.3}
.ach div b{display:block;font-size:14px;color:var(--ink)}
.ach div.got{border-color:var(--img);background:var(--panel)}
.ach div.got b::before{content:"★ ";color:var(--img)}
.ach div:not(.got){opacity:.7}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,15,13,.55);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:460px;max-height:100%;overflow-y:auto;background:var(--panel);border-radius:18px;border:1px solid var(--line);padding:18px;display:grid;gap:12px;animation:pop .25s ease-out;box-shadow:0 20px 50px var(--shadow);user-select:text;-webkit-user-select:text}
.card .eyebrow{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--c,var(--accent))}
.card h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.02;text-wrap:balance}
.card h4{margin:6px 0 -4px;font-family:var(--f-disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.card p{margin:0;line-height:1.45;font-size:15px}
.card ul{margin:0;padding-left:18px;line-height:1.45;font-size:14.5px;display:grid;gap:5px}
.choice{display:block;width:100%;text-align:left;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px}
.choice b{display:block;font-size:16px}
.choice span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.choice.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.choice.pri span{color:inherit;opacity:.85}
.logo{font-family:var(--f-disp);font-weight:800;font-size:52px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.logo em{font-style:normal;display:inline-block;background:var(--ed);color:#fff;padding:0 8px;border-radius:6px;margin-right:6px}
.signs{display:flex;flex-wrap:wrap;gap:5px}
.signs span{font-family:var(--f-disp);font-weight:800;color:#fff;background:var(--c);padding:3px 8px;border-radius:5px;font-size:15px}
.endscore{font-family:var(--f-num);font-size:40px;font-weight:600}
.field{display:grid;gap:6px}
.field input{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0 14px;font-size:18px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.seg button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px;padding:4px 6px;line-height:1.15}
.seg button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.scens{display:grid;gap:8px}
.scen{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 12px;display:grid;gap:3px}
.scen b{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.scen b em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scen span{font-size:13px;color:var(--muted);line-height:1.35}
.scen[aria-pressed="true"]{border:2px solid var(--accent);background:var(--panel);padding:9px 11px}
.scen[aria-pressed="true"] b em{color:var(--accent)}
.deck{display:flex;flex-wrap:wrap;gap:6px}
.deck button{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:line-through}
.deck button[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-color:var(--accent);text-decoration:none}

@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-38px);opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
@media (max-width:370px){.stat b{font-size:16px}.cb{width:42px;height:42px}#nav button{font-size:14px}}

function target(y){const b=y<=5?BASE_T[y-1]:BASE_T[4]+1e6*(y-5);return (b<0&&sc().tm>1?b:b*sc().tm)+DIFF[S.cfg.diff].add;}
function eachUnit(fn){S.floors.forEach((fl,f)=>fl.forEach((x,s)=>{if(x)fn(x,f,s);}));}
function live(x){return x&&!x.build&&!x.off;}
function capOf(t){let c=0;eachUnit(x=>{if(x.t===t&&live(x))c+=UNITS[t].cap*LV[x.lvl];});return c;}
function has(t){let h=false;eachUnit(x=>{if(x.t===t&&live(x))h=true;});return h;}
function lvlOf(t){let l=0;eachUnit(x=>{if(x.t===t&&live(x))l=Math.max(l,x.lvl);});return l;}
function N(r){return r==='rn'||r==='evs'?S.staff[r]:S.docs.filter(d=>d.r===r).length;}
function own(id){return!!(S.proj[id]&&S.proj[id].done);}
function certOn(id){return!!(S.cert[id]&&S.cert[id].on);}
function eff(k){return S.eff.reduce((m,e)=>e.k===k&&e.m?m*e.m:m,1);}
function effAdd(k){return S.eff.reduce((m,e)=>e.k===k&&e.a?m+e.a:m,0);}
function addEff(k,v,w,add,extra){S.eff.push(Object.assign(add?{k,a:v,w}:{k,m:v,w},extra||{}));}
function note(t,kind){S.log.unshift({t,kind:kind||'',y:S.year,wk:S.week});if(S.log.length>60)S.log.pop();}
function fte(){return S.docs.length+S.staff.rn+S.staff.evs;}
function cashTxt(){return S.cfg.sandbox?'Unlimited':money(S.cash);}
function canPay(c){return S.cfg.sandbox||S.cash>=c;}
function pay(c){if(!S.cfg.sandbox)S.cash-=c;}
function recruitFee(){return RECRUIT*sc().recruit;}

function roster(){
  const R={n:{},e:{},sal:0,rnMor:0,sat:0,ref:{},gm:{em:0,hosp:0,surg:0,oth:0},rep:0};
  for(const r of DOCROLES){R.n[r]=0;R.e[r]=0;R.ref[r]=0;}
  for(const d of S.docs){const t=TRAITS[d.tr];R.n[d.r]++;R.e[d.r]+=1+t.cap;R.sal+=d.sal*S.wage*(ROLES[d.r].g==='surg'?S.surgWage:1);R.rnMor+=t.rnMor||0;R.sat+=t.sat||0;R.ref[d.r]+=t.ref||0;R.gm[ROLES[d.r].g]+=t.gm||0;R.rep+=t.rep||0;}
  R.sal+=S.staff.rn*ROLES.rn.s*S.wage*S.rnWage*eff('rnCost')+S.staff.evs*ROLES.evs.s*S.wage;
  return R;
}

/* ================= Layout / flow ================= */
function layout(){
  const at={};let s=60,noise=0;const notes=[];
  eachUnit((x,f,i)=>{(at[x.t]=at[x.t]||[]).push([f,i]);});
  const on=t=>at[t]||[], fl=t=>on(t).map(p=>p[0]);
  const edF1=on('ED').some(p=>p[0]===0);
  if(on('ED').length){if(edF1){s+=10;notes.push(['+','ED sits at street level for ambulances.']);}else{s-=25;notes.push(['−','No ED on Floor 1: ambulance hand-offs are slow (ED −30%).']);}}
  const imgEd=on('IMG').some(p=>fl('ED').includes(p[0]));
  if(on('ED').length&&on('IMG').length){if(imgEd){s+=10;notes.push(['+','Imaging shares the ED floor: faster trauma and stroke workups (+8% ED).']);}else{s-=4;notes.push(['−','Imaging is on a different floor from the ED.']);}}
  if(on('OR').length&&on('ICU').length){const d=Math.min(...fl('OR').flatMap(a=>fl('ICU').map(b=>Math.abs(a-b))));
    if(d===0){s+=10;notes.push(['+','ORs and ICU share a floor: short post-op transport.']);}else if(d===1){s+=5;notes.push(['+','ICU is one floor from the ORs.']);}else{s-=6;notes.push(['−','ICU is far from the ORs: risky transports.']);}}
  const cathNear=fl('CATH').some(f=>fl('ED').includes(f)||fl('ICU').includes(f));
  if(on('CATH').length&&cathNear){s+=5;notes.push(['+','Cath lab near the ED or ICU: faster door-to-balloon times.']);}
  if(on('LD').length&&on('OR').length){if(fl('LD').some(f=>fl('OR').includes(f))){s+=5;notes.push(['+','L&D shares a floor with the ORs for emergency C-sections.']);}else{s-=3;notes.push(['−','L&D is away from the ORs.']);}}
  if(on('CLIN').length){if(fl('CLIN').includes(0)){s+=5;notes.push(['+','Clinic is on Floor 1 for easy outpatient access.']);}else{s-=4;notes.push(['−','Outpatients have to ride elevators to the clinic.']);}}
  if(on('CAFE').length&&fl('CAFE').includes(0)){s+=3;notes.push(['+','Cafeteria by the lobby.']);}
  for(const [f,i] of on('ED'))for(const j of [i-1,i+1]){const n=S.floors[f][j];if(n&&['MS','ICU','LD'].includes(n.t)){s-=6;noise++;notes.push(['−',UNITS[n.t].sn+' is right next to the ED: noise and traffic hurt sleep and satisfaction.']);}}
  return{score:clamp(s,0,100),notes,edF1,imgEd,cathNear,noise};
}

/* ================= Simulation (one week) ================= */
function sim(){
  const L=layout(),sp=S.sup,SC=sc(),RS=roster(),E=RS.e;
  let needRn=0,needEvs=0,upkeep=0;
  eachUnit(x=>{const d=UNITS[x.t];if(!x.build)upkeep+=d.up*LV[x.lvl];if(live(x)){needRn+=d.rn*LV[x.lvl];needEvs+=d.evs*LV[x.lvl];}});
  const nF=needRn?Math.min(1,S.staff.rn*eff('rn')/needRn):1, evsF=needEvs?Math.min(1,S.staff.evs/needEvs):1;
  const capM=eff('cap'), pf=SC.pop*(1+DIFF[S.cfg.diff].grow*(S.year-1))*(own('garage')?1.05:1), rf=.6+.8*S.rep/100;
  const labF=has('LAB')?sp.labF:.6, opF=nF*Math.sqrt(evsF)*capM*(.7+.3*labF);
  const pm=SC.prod*(own('ehr')?1.05:1);
  const pr=g=>(.8+.2*Math.min(1,S.morale[g]/60))*pm;
  const icuOn=has('ICU'), rob=own('robot')?1.15:1;

  const edArr=has('ED')?90*SC.ed*pf*rf*eff('edDemand')*(certOn('trauma')?1.12:1)*(certOn('stroke')?1.05:1)*(own('helipad')?1.05:1):0;
  const edCap=capOf('ED')*opF*(L.edF1?1:.7)*(L.imgEd?1.08:1)*(.75+.25*sp.bedF);
  const edDoc=E.em*50*pr('em');
  const ed=Math.min(edArr,edCap,edDoc)*(has('IMG')?.6+.4*sp.imgF:.6);
  const clinDem=has('CLIN')?200*SC.clin*pf*rf:0;
  const clin=Math.min(clinDem,capOf('CLIN')*opF*(own('tele')?1.3:1),E.pcp*55*pr('oth')*(own('tele')?1.2:1));
  const gsDem=(.04*ed+.015*clin+(4*N('gs')+RS.ref.gs)*rf)*(icuOn?1:.85)*eff('surg')*(certOn('trauma')?1.15:1)*rob;
  const orDem=(.015*ed+.02*clin+(5*N('ortho')+RS.ref.ortho)*rf)*eff('surg')*rob;
  const cdDem=(.03*ed+.01*clin+(3*N('card')+RS.ref.card)*rf)*(icuOn?1:.5)*(certOn('stemi')?1.3:1);
  let gsC=Math.min(gsDem,E.gs*6*pr('surg')*rob), orC=Math.min(orDem,E.ortho*7*pr('surg')*rob);
  const surgWant=gsC+orC;
  const orCap=capOf('OR')*opF*eff('orCap')*rob, anCap=E.anes*16*pr('oth');
  const orScale=surgWant>0?Math.min(1,orCap/surgWant,anCap/surgWant):1;
  gsC*=orScale;orC*=orScale;
  let cath=Math.min(cdDem,E.card*6*pr('surg'),capOf('CATH')*opF*eff('orCap'));
  const medAdm=(.16*ed+.01*clin)*eff('inpt');
  const msBeds=capOf('MS')*nF*Math.sqrt(evsF)*capM*(has('PH')?1:.9)*eff('beds');
  const postNeed=(.7*(gsC+orC)*3.5+.4*cath*1.5)/7, medNeed=medAdm*4.5/7;
  const bedF=(postNeed+medNeed)>0?Math.min(1,msBeds/(postNeed+medNeed)):1;
  gsC*=.4+.6*bedF;orC*=.4+.6*bedF;cath*=.6+.4*bedF;
  const surg=gsC+orC, medS=medAdm*bedF;
  const census=medS*4.5/7+(.7*surg*3.5+.4*cath*1.5)/7;
  const hospCap=E.hosp*7*pr('hosp');
  const hospLoad=census>0?(hospCap>0?census/hospCap:3):0;
  const icuAdm=(.03*ed+.12*surg+.25*cath)*eff('icu')*(certOn('trauma')?1.1:1)*(own('helipad')?1.2:1);
  const icuNeed=icuAdm*3.5/7, icuBeds=capOf('ICU')*nF*Math.sqrt(evsF)*capM;
  const icuF=icuNeed>0?Math.min(1,icuBeds/icuNeed):1;
  const icuCen=icuNeed*icuF, icuS=icuAdm*icuF, transfers=icuAdm-icuS;
  const intCap=E.intens*4*pr('oth');
  const icuLoad=icuCen>0?(intCap>0?icuCen/intCap:2.5):0;
  const ldDem=has('LD')?(14*pf*rf+RS.ref.ob)*(certOn('baby')?1.25:1):0;
  const deliv=Math.min(ldDem,capOf('LD')*opF,E.ob*5*pr('oth'));
  const studNeed=.9*ed+2*medS+surg+.5*cath+.15*clin+.3*deliv;
  const imgCap=Math.min(capOf('IMG')*capM*eff('img'),E.rad*200*pr('oth'));
  const studies=Math.min(studNeed,imgCap), imgF=studNeed>0?studies/studNeed:1;
  const labNeed=ed+.4*clin+(census+icuCen)*3+surg+cath+deliv, labCap=capOf('LAB')*capM;
  const labF2=labNeed>0?Math.min(1,labCap/labNeed):1;
  const inpt=census+icuCen, phCap=capOf('PH');
  const phF=inpt>0?(phCap>0?Math.min(1,phCap/inpt):0):1;
  S.sup={imgF,labF:labF2,bedF};

  const procs=surg+cath;
  const compRate=.03+.16*pos0(hospLoad-1)+.08*(1-nF)+.05*(1-evsF)+(procs>0?.05*(1-icuF):0)+.04*pos0(icuLoad-1)+.03*(1-phF)+effAdd('comp');
  const comps=procs*compRate+medS*compRate*.5;
  const hai=.8+5*(1-evsF)+effAdd('hai');
  const lwbs=edArr>0?(edArr-ed)/edArr:0;

  const fac={ed:ed*1100,adm:medS*11000,gs:gsC*16000,ortho:orC*17000,cath:cath*22000,icu:icuS*20000,img:studies*280,clin:clin*90,ld:deliv*7500};
  const supF={ed:.15,adm:.2,gs:.28+(own('robot')?.03:0),ortho:.45+(own('robot')?.03:0),cath:.38,icu:.25,img:.1,clin:.05,ld:.15};
  const wr={em:ed*2.6,hosp:census*7*1.5,gs:gsC*22,ortho:orC*24,card:cath*34,anes:surg*8.9,intens:icuCen*7*3.8,rad:studies*.94,pcp:clin*1.7,ob:deliv*26};
  let facT=0,supplies=0,wT=0;for(const k in fac){facT+=fac[k];supplies+=fac[k]*supF[k];}for(const k in wr)wT+=wr[k];
  const vbp=1+(S.stars-3)*.01, payM=S.payer*vbp*eff('pay')*(certOn('leapfrog')?1.01:1);
  const facRev=facT*payM, proRev=wT*S.cf*payM, rev=facRev+proRev+SC.dsh;
  const compCost=comps*15000;
  const wages=RS.sal/52+effAdd('wage');
  const overhead=60e3+10e3*S.floors.length+SC.oh-(own('solar')?15e3:0);
  const costPlus=(SC.cp||0)*(wages+upkeep+overhead);
  const op=rev+costPlus-supplies-compCost-wages-upkeep-overhead;
  if(!S.cfg.sandbox)S.cash+=op;

  const cafe=lvlOf('CAFE'), gard=has('GARD');
  const qT=84-45*(1-nF)-30*(1-evsF)-50*pos0(hospLoad-1)-25*pos0(icuLoad-1)-(icuNeed>0?8*(1-icuF):0)-(inpt>0?10*(1-phF):0)-10*(1-bedF)-8*(1-imgF)-8*(1-labF2)+(L.score-60)/5+(certOn('stroke')?2:0)+(certOn('magnet')?3:0)+effAdd('q');
  S.Q=clamp(S.Q+(qT-S.Q)*.25,0,100);
  const food=[-8,0,8,14][cafe];
  const sT=52+food+(gard?6:0)-25*(1-evsF)-25*(1-nF)-30*lwbs-5*L.noise-12*(1-bedF)+(S.Q-70)/3+(deliv>0?3:0)+clamp(RS.sat,-8,8)+(certOn('magnet')?2:0)+(own('tele')?2:0)+(own('garage')?3:0)+effAdd('sat');
  S.sat=clamp(S.sat+(sT-S.sat)*.25,0,100);
  S.stars=clamp(Math.round((1+4*S.sat/100)*2)/2,1,5);
  S.rep=clamp(S.rep+((S.Q-65)+(S.sat-55))/120-.03*transfers-(lwbs>.15?.3:0)+RS.rep+(certOn('trauma')?.02:0)+(certOn('leapfrog')?.03:0),0,100);
  S.flow=L.score;

  const amen=(cafe>=2?4:0)+(gard?3:0);
  const edLoad=edDoc>0?Math.min(edArr,edCap)/edDoc:0;
  const anLoad=anCap>0?surgWant/anCap:(surgWant>0?2:0);
  const othLoad=Math.max(anLoad,icuLoad,E.rad?studNeed/(E.rad*200):0,E.pcp?clinDem/(E.pcp*55):0,E.ob?ldDem/(E.ob*5):0);
  const surgN=N('gs')+N('ortho')+N('card');
  const orShort=surgWant>0?1-orScale:0;
  const gm=g=>clamp(RS.gm[g],-15,10);
  const tgt={
    em:76+amen-40*pos0(edLoad-1)-15*(1-bedF)+gm('em'),
    hosp:76+amen-90*pos0(hospLoad-1)-12*(1-bedF)+gm('hosp'),
    surg:76+amen-80*pos0(hospLoad-1)-30*(1-bedF)-30*orShort-(icuOn?0:8)+gm('surg'),
    oth:76+amen-40*pos0(othLoad-1)+gm('oth'),
    rn:76+amen-80*(1-nF)+clamp(RS.rnMor,-15,15)+(certOn('magnet')?8:0)+effAdd('rnMor')
  };
  for(const g in tgt)S.morale[g]=clamp(S.morale[g]+(tgt[g]-S.morale[g])*.2,0,100);
  const why={em:'the ED is understaffed',hosp:'patient loads are unsafe',surg:hospLoad>1.05?'post-op patients lack hospitalist coverage':bedF<.95?'cases keep getting cancelled for lack of beds':orShort>.05?'they cannot get OR or anesthesia time':'working conditions',oth:'the workload is unsustainable'};
  if(S.morale.rn<40&&S.staff.rn>5&&rnd()<.3){const n=Math.min(S.staff.rn-5,3);S.staff.rn-=n;note(`${n} nurses resigned: short staffing is burning them out.`,'bad');}
  for(const [g] of GROUPS){
    if(g==='rn')continue;
    if(S.morale[g]<35){const pool=S.docs.filter(d=>ROLES[d.r].g===g);for(const d of pool){if(rnd()<.035*(TRAITS[d.tr].quit||1)){S.docs.splice(S.docs.indexOf(d),1);note(`${d.nm} (${ROLES[d.r].n.toLowerCase()}) resigned because ${why[g]}.`,'bad');shake();snd('bad');break;}}}
  }
  if(surgN===0)S.morale.surg=Math.max(S.morale.surg,60);

  const pts=ed+clin+medS+surg+cath+deliv+icuS;
  S.score+=Math.round(pts*(S.Q/75)*.5+pos0(op)/2500);
  S.ytd.op+=op;S.ytd.rev+=rev;S.ytd.pts+=pts;S.tot.pts+=pts;S.tot.w+=wT;S.surgeries+=surg;
  for(const k in wr)S.ytd.w[k]=(S.ytd.w[k]||0)+wr[k];

  const load={},flag={},set=(t,l,f)=>{load[t]=l;if(f)flag[t]=f;};
  const sw=nF<.95?'Short on nurses':null;
  set('ED',edCap>0?Math.min(edArr,edCap)/edCap:0,!L.edF1?'Move the ED to Floor 1':edDoc<Math.min(edArr,edCap)*.97?'Short on emergency physicians':edCap<edArr*.97?'ED at capacity: upgrade or add another':sw);
  set('MS',msBeds>0?Math.min(1,(postNeed+medNeed)/msBeds):0,bedF<.97?'Beds full: patients boarding in the ED':hospLoad>1.05?(N('hosp')?'Hospitalists overloaded':'No hospitalists'):sw);
  set('ICU',icuBeds>0?icuCen/icuBeds:0,icuF<.97?'ICU full: transfers out':icuLoad>1.05?(N('intens')?'Intensivists overloaded':'No intensivist coverage'):sw);
  set('OR',orCap>0?surg/orCap:0,(N('gs')+N('ortho'))===0?'No surgeons on staff':anCap<surgWant*.97?(N('anes')?'Anesthesia is the bottleneck':'No anesthesiologists'):orCap<surgWant*.97?'OR time is the bottleneck':bedF<.97?'Cases cancelled: no post-op beds':sw);
  const cathCap=capOf('CATH');
  set('CATH',cathCap>0?cath/cathCap:0,N('card')===0?'No interventional cardiologists':!icuOn?'No ICU backup: high-risk cases sent away':sw);
  set('IMG',capOf('IMG')>0?Math.min(1,studNeed/capOf('IMG')):0,N('rad')===0?'No radiologists':imgF<.97?'Imaging backlog':null);
  set('LAB',labCap>0?Math.min(1,labNeed/labCap):0,labF2<.97?'Lab overloaded: upgrade it':null);
  set('PH',phCap>0?Math.min(1,inpt/phCap):0,phF<.99&&phCap>0?'Pharmacy overloaded':null);
  const clCap=capOf('CLIN');set('CLIN',clCap>0?clin/clCap:0,N('pcp')===0?'No primary care physicians':sw);
  const ldCap=capOf('LD');set('LD',ldCap>0?deliv/ldCap:0,N('ob')===0?'No OB/GYNs':sw);
  set('CAFE',cafe/3,null);set('GARD',gard?.6:0,null);
  const unitRev={ED:fac.ed+wr.em*S.cf,MS:fac.adm+wr.hosp*S.cf,OR:fac.gs+fac.ortho+(wr.gs+wr.ortho+wr.anes)*S.cf,CATH:fac.cath+wr.card*S.cf,ICU:fac.icu+wr.intens*S.cf,IMG:fac.img+wr.rad*S.cf,CLIN:fac.clin+wr.pcp*S.cf,LD:fac.ld+wr.ob*S.cf};

  return{edArr,ed,edCap,edDoc,clin,clinDem,gsC,orC,cath,surgWant,orCap,anCap,orScale,medAdm,medS,msBeds,bedF,census,hospLoad,icuAdm,icuS,icuCen,icuNeed,icuF,icuLoad,transfers,
    ldDem,deliv,studNeed,studies,imgF,labNeed,labF:labF2,phF,inpt,nF,evsF,needRn,needEvs,compRate,comps,hai,lwbs,
    facRev,proRev,dsh:SC.dsh,costPlus,rev,supplies,compCost,wages,upkeep,overhead,op,wT,pts,load,flag,unitRev,L,cafe};
}

/* ================= Advisor + patient voices ================= */
function issues(r){
  const a=[];if(!r)return a;
  const p=(sev,t)=>a.push({sev,t});
  if(r.nF<.95)p(3,`Nursing is at ${pct(r.nF)} of need (${S.staff.rn} of ${Math.ceil(r.needRn)} RNs). Short-staffed units run slower and less safely.`);
  if(r.hospLoad>1.05)p(3,N('hosp')?`Each hospitalist is covering ${(r.census/N('hosp')).toFixed(1)} patients (safe is about 7). Surgeons are unhappy and post-op complications are climbing.`:`No hospitalists: ${Math.round(r.census)} inpatients have no attending.`);
  if(r.bedF<.95)p(3,`Med-Surg beds are full. Admissions are boarding in the ED and ${pct(1-(.4+.6*r.bedF))} of surgeries are being cancelled.`);
  if(r.evsF<.95)p(2,`Cleaning crew is at ${pct(r.evsF)} of need. Hospital-acquired infections are rising.`);
  if(r.edArr>0&&r.lwbs>.08)p(2,`${Math.round(r.edArr-r.ed)} ED patients a week leave without being seen (${pct(r.lwbs)}). ${r.edDoc<r.edCap?'Hire emergency physicians.':'Expand the ED or fix the bottleneck behind it.'}`);
  if(r.icuNeed>0&&r.icuF<.95)p(2,has('ICU')?`ICU is full: ${r.transfers.toFixed(1)} critical patients transferred out each week.`:`No ICU: ${r.transfers.toFixed(1)} critical patients a week are transferred out, and surgeons avoid high-risk cases.`);
  if(r.icuLoad>1.05)p(2,N('intens')?`Intensivists are stretched (${(r.icuCen/N('intens')).toFixed(1)} ICU patients each, safe is 4).`:'ICU has no intensivist coverage. Quality is suffering.');
  if(r.surgWant>0&&r.orScale<.95)p(2,r.anCap<r.orCap?'Surgeons are waiting on anesthesia. Hire anesthesiologists.':'Surgeons cannot get OR time. Upgrade or add operating suites.');
  if(r.imgF<.95)p(2,'Imaging backlog is slowing the ED and wards. Add radiologists or imaging capacity.');
  if(!has('IMG'))p(2,'No imaging: CT and X-rays are sent out, so the ED runs at 60%.');
  if(!has('LAB'))p(2,'No lab: specimens are sent out, so every unit runs at 70%.');
  if(r.labF<.95)p(1,'The lab is overloaded. Upgrade it.');
  if(r.inpt>0&&r.phF<.95)p(1,has('PH')?'Pharmacy cannot keep up with inpatient orders.':'No inpatient pharmacy: medication errors are rising.');
  if(r.cafe===0)p(1,'No cafeteria. Patients are rating the food poorly.');
  r.L.notes.filter(n=>n[0]==='−').forEach(n=>p(1,'Layout: '+n[1]));
  if(N('gs')+N('ortho')>0&&!has('OR'))p(2,'You have surgeons but no operating suites.');
  if(N('card')>0&&!has('CATH'))p(2,'You have interventional cardiologists but no cath lab.');
  if(r.op<0&&!S.cfg.sandbox)p(1,`Losing ${money(-r.op)} a week. Surgery, cardiology and clinic referrals drive the most RVUs.`);
  a.sort((x,y)=>y.sev-x.sev);
  if(!a.length)a.push({sev:0,t:r.op>0?`Running smoothly at ${money(r.op)} a week. Check Goals for designations and projects to chase next.`:'Stable. Grow volume with procedural service lines.'});
  return a;
}
function voices(r){
  const v=[],p=(t,tone,k)=>v.push({t,tone,k:k||'pt'});
  if(r.cafe===0)p('Is there anywhere to eat in this place?','bad');
  if(r.cafe===1)p('Mystery meatloaf again…','bad');
  if(r.cafe===2)p('The soup actually tastes fresh!','good');
  if(r.cafe===3)p('Best salmon I’ve had. In a hospital!','good');
  if(r.lwbs>.08)p(`${Math.round(4+r.lwbs*20)} hours in the waiting room…`,'bad');
  if(r.evsF<.9)p('Something sticky is on my bed rail.','bad');
  if(r.nF<.9){p('I pressed my call light 40 min ago.','bad');p('We need more hands up here!','bad','rn');}
  if(r.L.noise)p('ED sirens kept me up all night.','bad');
  if(has('GARD'))p('Sitting in the garden made my day.','good');
  if(r.hospLoad>1.1){p('I never see the same doctor twice.','bad');p('14 patients and 6 admits pending…','bad','md');}
  if(r.bedF<.95)p('Day two on a hallway stretcher.','bad');
  if(r.transfers>.5)p('They’re sending Dad to another hospital?','bad');
  if(S.Q>80)p('My nurse was an absolute angel.','good');
  if(r.orC>.5)p('My new knee already feels great.','good');
  if(r.gsC>.5)p('Gallbladder out, home tomorrow!','good');
  if(r.cath>.5)p('Stent in. Chest pain gone.','good');
  if(r.deliv>.5)p('Welcome to the world, little one!','good');
  if(r.clin>0)p('My doctor actually listened to me.','good');
  if(r.imgF<.95)p('Still waiting on my CT results…','bad');
  if(S.morale.surg<45&&N('gs')+N('ortho')>0)p('My post-op patients need a hospitalist!','bad','md');
  const fav=S.docs.find(d=>d.tr==='star'||d.tr==='whisper');if(fav)p(`${fav.nm} explained everything so clearly.`,'good');
  if(r.ed>0&&r.lwbs<.03)p('In and out of the ER in two hours!','good');
  if(!v.length)p('Nice place. Very clean.','good');
  return v;
}

function maybeEvent(){
  if(S.cool>0){S.cool--;return;}
  const m=FREQ[S.cfg.freq]*DIFF[S.cfg.diff].ev;if(!m)return;
  if(rnd()>(.035+.015*(S.year-1))*m)return;
  const pool=EVENTS.filter(e=>S.cfg.deck.includes(e.id)).map(e=>({e,w:e.w()})).filter(o=>o.w>0);
  let t=pool.reduce((a,o)=>a+o.w,0)*rnd();
  const pk=pool.find(o=>(t-=o.w)<0);if(!pk)return;
  S.cool=6;const ev=pk.e.make(sev());
  if(['mci','legion','strike','ransom'].includes(pk.e.id))shake();
  note(ev.title,'warn');snd('page');
  showModal(ev);
}

/* ================= Certifications, projects, achievements ================= */
function weeklyGoals(){
  for(const c of CERTS){
    const st=S.cert[c.id],ok=c.req().every(x=>x[1]);
    if(!st.earned){st.held=ok?st.held+1:0;if(st.held>=c.need){st.earned=true;st.on=true;S.rep+=5;S.score+=1000;note(`${c.n} designation earned.`,'good');toast(c.n,'Designation earned · '+c.fx,'--good','✓');snd('fanfare');}}
    else{const was=st.on;st.on=ok;if(was&&!ok)note(`${c.n} lapsed: requirements no longer met.`,'bad');if(!was&&ok)note(`${c.n} reinstated.`,'good');}
  }
  for(const p of PROJ){const st=S.proj[p.id];if(st&&!st.done&&--st.wk<=0){st.done=true;note(`${p.n} is complete.`,'good');snd('coin');}}
  const r=S.last;if(!r)return;
  if(S.surgeries>0)unlock('firstcut');
  if(S.stars>=5)unlock('five');
  if(lvlOf('CAFE')>=3)unlock('chef');
  if(S.floors.length>=6)unlock('tower');
  if(S.floors.length>=3&&S.floors.every(fl=>fl.every(x=>x)))unlock('full');
  if(ORDER.every(t=>has(t)))unlock('eco');
  S.zero=(r.compRate<.04&&r.hai<1&&r.gsC+r.orC+r.cath>=3)?S.zero+1:0;if(S.zero>=13)unlock('zero');
  if(S.mciWorst>=0)S.mciWorst=Math.max(S.mciWorst,r.lwbs);
  if(S.docs.some(d=>d.tr==='star'))unlock('star');
  if(S.tot.w>=1e5)unlock('rvu');
  if(!S.cfg.sandbox&&S.cash>=50e6)unlock('cash');
  if(CERTS.filter(c=>certOn(c.id)).length>=3)unlock('certs');
}
function achGot(){return store.get('ht-ach',[]);}
function unlock(id){
  if(S.cfg.sandbox)return;const got=achGot();if(got.includes(id))return;
  got.push(id);store.set('ht-ach',got);
  const a=ACH.find(x=>x[0]===id);if(!a)return;
  S.score+=500;
  note(`Achievement: ${a[1]}.`,'good');toast(a[1],'Achievement unlocked · '+a[2],'--img','★');snd('fanfare');
}
function toast(title,sub,col,mark){
  const d=document.createElement('div');d.className='toast';d.style.setProperty('--c',`var(${col})`);
  d.innerHTML=`<div class="medal">${mark}</div><div><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),3700);
}

/* ================= Sound ================= */
let AC=null;
function tone(f,dur,type,vol,f2,delay){
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.linearRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);
}
function snd(k){
  if(!soundOn)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
  try{({
    tap(){tone(660,.05,'square',.025);},
    build(){tone(140,.18,'triangle',.18,70);tone(220,.08,'square',.03,null,.05);},
    coin(){tone(988,.08,'triangle',.08);tone(1319,.18,'triangle',.08,null,.08);},
    page(){tone(784,.35,'sine',.12);tone(622,.5,'sine',.12,null,.36);},
    siren(){for(let i=0;i<3;i++){tone(620,.35,'sawtooth',.025,920,i*.7);tone(920,.35,'sawtooth',.025,620,i*.7+.35);}},
    fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.08,null,i*.09));},
    bad(){tone(220,.35,'sawtooth',.04,150);}
  })[k]();}catch(e){}
}

/* ================= Turn loop + save ================= */
function running(){return started&&!S.over&&!S.paused&&!sheet&&!modalOpen;}
setInterval(()=>{if(!S||!running())return;acc+=100*S.speed;$('#wkB').style.width=Math.min(100,acc/TICK*100)+'%';if(acc>=TICK){acc=0;tick();}},100);
function saveGame(){if(S&&started&&!S.over)store.set('ht-save',S);}

function tick(){
  S.abs++;
  S.pending.forEach(p=>p.wk--);
  S.pending=S.pending.filter(p=>{if(p.wk>0)return true;
    if(p.doc){S.docs.push(p.doc);note(`${p.doc.nm} finished credentialing and started as ${ROLES[p.r].n.toLowerCase()}.`,'good');}
    else{S.staff[p.r]+=p.n;note(`${p.n} ${ROLES[p.r].n.toLowerCase()} started work.`,'good');}return false;});
  eachUnit(x=>{if(x.build>0&&--x.build===0){note(UNITS[x.t].n+' is open.','good');snd('coin');}if(x.upg>0&&--x.upg===0){x.lvl++;note(`${UNITS[x.t].n} upgraded to level ${x.lvl}.`,'good');}if(x.off>0)x.off--;});
  const r=sim();S.last=r;
  const vs=voices(r),bad=vs.filter(v=>v.tone==='bad');
  const vv=(bad.length&&rnd()<.6)?pick(bad):pick(vs);
  S.voices.unshift({...vv,y:S.year,wk:S.week});if(S.voices.length>10)S.voices.pop();say(vv);
  if(r.ed>0)spawnAmbulance(S.eff.some(e=>e.k==='_mci')?2:1);
  weeklyGoals();
  S.eff.forEach(e=>e.w--);S.eff.filter(e=>e.w<=0&&e.end).forEach(e=>ENDS[e.end]());S.eff=S.eff.filter(e=>e.w>0);
  render();fx(r);
  if(!S.cfg.sandbox){if(S.cash<-10e6)return end('bankrupt');if(S.rep<=2)return end('rep');}
  S.week++;
  if(S.week>52)return yearEnd();
  maybeEvent();saveGame();
}

function yearEnd(){
  const y=S.year,op=S.ytd.op;
  S.week=52;
  if(op>0)unlock('black');
  if(S.cfg.sandbox){newYear();note(`Sandbox: Year ${y} closed at ${money(op)} operating income.`);render();saveGame();return;}
  const tgt=target(y),pass=op>=tgt,last=y>=S.cfg.len;
  if(pass){S.score+=1500*y;snd('coin');}else{S.warn++;snd('bad');}
  S.hist.push({y,op,tgt,pass,pts:S.ytd.pts});
  const fired=!pass&&(S.warn>=2||last);
  const body=`<p>Operating income <b class="num ${op>=0?'pos':'neg'}">${money(op)}</b> against a target of <b class="num">${money(tgt)}</b>. ${int(S.ytd.pts)} patient encounters and ${int(Object.values(S.ytd.w).reduce((a,b)=>a+b,0))} wRVUs this year.</p>`+
    (pass?`<p>The board approves your plan. +${int(1500*y)} bonus points.</p>`:fired?'<p>The board has seen enough.</p>':'<p>The board puts you on probation. Miss another target and you are out.</p>')+
    (!fired&&!last?`<p><b>Year ${y+1}:</b> Medicare cuts the conversion factor 2.8%, wages rise 3%, demand grows and crises come more often. Target: ${money(target(y+1))}.</p>`:'');
  showModal({c:pass?'--good':'--bad',tag:`Year ${y} board review`,title:pass?'Target met':'Target missed',body,ch:[{l:fired||last?'See results':`Start Year ${y+1}`,f(){
    if(fired){end('fired');return null;}
    if(last){end('win');return null;}
    newYear();render();saveGame();return null;}}]});
}
function newYear(){S.year++;S.week=1;S.cf*=.972;S.wage*=1.03;S.payer*=.985;S.ytd={op:0,rev:0,pts:0,w:{}};S.cool=4;note(`Year ${S.year} begins. Medicare conversion factor cut 2.8%.`,'warn');}

function end(kind){
  S.over=kind;store.del('ht-save');
  if(kind==='win'){S.score+=Math.round(S.cash/1e4)+Math.round(S.rep*50);unlock('win');if(S.cfg.diff==='chief')unlock('chief');}
  const best=store.get('ht-best',0);if(S.score>best)store.set('ht-best',S.score);
  const T={win:['Mission accomplished',`${esc(S.cfg.name)} is a regional anchor: in the black and trusted by its community.`,'--good'],
    bankrupt:['Bankrupt','The line of credit is exhausted and the system is selling your hospital.','--bad'],
    fired:['The board let you go','Missed operating targets cost you the job.','--bad'],
    rep:['CMS pulls your certification','Quality and patient experience collapsed. Medicare terminated your provider agreement.','--bad']}[kind];
  postScore(kind);
  const rows=S.hist.map(h=>`<tr><td>Year ${h.y}</td><td class="r ${h.op>=0?'pos':'neg'}">${money(h.op)}</td><td class="r">${money(h.tgt)}</td><td class="r">${h.pass?'Met':'Missed'}</td></tr>`).join('');
  showModal({c:T[2],tag:kind==='win'?'You win':'Game over',title:T[0],body:`<p>${T[1]}</p><div class="kpi"><span>Final score</span><b class="endscore">${int(S.score)}</b><small>${S.score>best?'New best score':'Best: '+int(best)} · ${esc(SCEN[S.cfg.scen].n)}, ${DIFF[S.cfg.diff].n}</small></div>`+
    `<div class="scroll"><table><tr><th></th><th class="r">Op. income</th><th class="r">Target</th><th class="r">Board</th></tr>${rows||'<tr><td colspan="4">No completed years.</td></tr>'}</table></div><p class="num" style="font-size:13px;color:var(--muted)">${int(S.tot.pts)} patients · ${int(S.tot.w)} wRVUs · ${S.stars.toFixed(1)}★ · ${CERTS.filter(c=>S.cert[c.id].earned).length} designations</p>`,
    ch:[{l:'Play again',d:'Same hospital, same settings.',pri:true,f(){startGame(S.cfg);return null;}},{l:'New hospital',d:'Change the name, scenario or rules.',f(){showSetup();return null;}},{l:'Hall of fame',f(){showLeaders(true);return null;}}]});
}

function moveTo(a,x,dt){const d=x-a.x,sp=24*dt;if(Math.abs(d)<=sp){a.x=x;return true;}a.x+=Math.sign(d)*sp;a.ph+=dt*10;return false;}
function updAgents(dt){
  const pts=S.last?S.last.pts:15,want=Math.round(clamp(4+pts/30,4,30));
  if(agents.length<want&&rnd()<dt*2.2)spawnAgent();
  const sc0=shaftC();
  for(const a of agents){
    switch(a.st){
      case 'in':if(moveTo(a,a.tf===0?a.tx:sc0,dt)){if(a.tf===0){a.st='stay';a.tm=3+rnd()*5;}else{a.st='ride';a.hide=true;a.tm=.4+a.tf*.45;lift.ty=floorLine(a.tf);}}break;
      case 'ride':if((a.tm-=dt)<=0){a.f=a.tf;a.x=sc0;a.hide=false;a.st='go';}break;
      case 'go':if(moveTo(a,a.tx,dt)){a.st='stay';a.tm=3+rnd()*5;}break;
      case 'stay':if(!a.say&&(a.tm-=dt)<=0)a.st='back';break;
      case 'back':if(moveTo(a,a.f===0?G.x0-6:sc0,dt)){if(a.f===0)a.dead=true;else{a.st='down';a.hide=true;a.tm=.4+a.f*.45;lift.ty=floorLine(0);}}break;
      case 'down':if((a.tm-=dt)<=0){a.f=0;a.x=sc0;a.hide=false;a.st='out';}break;
      case 'out':if(moveTo(a,G.x0-6,dt))a.dead=true;break;
    }
    if(a.f>=S.floors.length||a.tf>=S.floors.length)a.dead=true;
  }
  agents=agents.filter(a=>!a.dead);
  for(const v of vehicles){
    if(v.st==='in'){v.x-=60*dt;if(v.x<=v.stop){v.x=v.stop;v.st='park';v.tm=2;const rr=roomRect(0,v.s);spawnAgent({f:0,s:v.s,t:'ED',x:v.x+10});const a=agents[agents.length-1];if(a){a.tx=rr.x+8+rnd()*(rr.w-16);a.k='pt';}}}
    else if(v.st==='park'){if((v.tm-=dt)<=0)v.st='out';}
    else{v.x-=70*dt;if(v.x<-60)v.dead=true;}
  }
  vehicles=vehicles.filter(v=>!v.dead);
}
function say(v){
  const cand=agents.filter(a=>!a.hide&&!a.say&&(a.st==='stay'||a.st==='go')&&(v.k==='pt'?a.k==='pt'||a.k==='vis':v.k==='md'?a.k==='md'||a.k==='sg':a.k==='rn'));
  const a=cand.length?pick(cand):null;if(a){a.say={t:v.t,tone:v.tone,until:performance.now()+3600};if(a.st==='stay')a.tm=Math.max(a.tm,3.6);}
}

function frame(now){
  requestAnimationFrame(frame);

/* ================= Actions ================= */
function arm(k){armed[k]=true;renderSheet();setTimeout(()=>{if(armed[k]){armed[k]=false;if(sheet)renderSheet();}},3000);}
function act(a,el){
  if(sheet==='slot'){
    const [f,s]=sheetArg,x=S.floors[f][s];
    if(a==='build'){const t=el.dataset.t,d=UNITS[t];if(!canPay(d.c))return;pay(d.c);const n=u(t);n.build=d.bw;S.floors[f][s]=n;note(`Construction started: ${d.n} on Floor ${f+1}.`);snd('build');closeSheet();render();return;}
    if(a==='upg'&&x){const c=UNITS[x.t].c*.6*x.lvl;if(!canPay(c)||x.lvl>=3||x.upg||x.build)return;pay(c);x.spent+=c;x.upg=3;note(`${UNITS[x.t].n} upgrade under way.`);snd('build');render();return;}
    if(a==='demo'&&x){if(!armed.demo)return arm('demo');if(!S.cfg.sandbox)S.cash+=x.spent*.3;S.floors[f][s]=null;note(`${UNITS[x.t].n} demolished.`);snd('bad');closeSheet();render();return;}
  }
  if(a==='hire'){const r=el.dataset.r,Rr=ROLES[r];if(!canPay(AGENCY))return;pay(AGENCY);S.pending.push({r,n:Rr.b,wk:1});snd('tap');render();return;}
  if(a==='fire'){const r=el.dataset.r,Rr=ROLES[r],n=Math.min(Rr.b,S.staff[r]);if(n<=0)return;S.staff[r]-=n;pay(n*Rr.s/52*4*S.wage);if(Rr.g==='rn')S.morale.rn=clamp(S.morale.rn-4,0,100);render();return;}
  if(a==='cands'){openSheet('hire',el.dataset.r);return;}
  if(a==='hireDoc'){const r=sheetArg,c=cands(r),i=+el.dataset.i,d=c.list[i],fee=recruitFee();if(!d||!canPay(fee))return;pay(fee);S.pending.push({r,doc:d,wk:sc().cred});c.list.splice(i,1,makeDoc(r));note(`Offer accepted: ${d.nm} (${TRAITS[d.tr].n}) is credentialing.`);snd('coin');openSheet('staff');render();return;}
  if(a==='reroll'){if(!canPay(REROLL))return;pay(REROLL);S.cands[sheetArg]={until:S.abs+8,list:[makeDoc(sheetArg),makeDoc(sheetArg),makeDoc(sheetArg)]};snd('tap');render();return;}
  if(a==='toStaff'){openSheet('staff');return;}
  if(a==='fireDoc'){const id=el.dataset.id,d=S.docs.find(x=>x.id===id);if(!d)return;if(!armed['f'+id])return arm('f'+id);
    S.docs.splice(S.docs.indexOf(d),1);pay(d.sal/13);const g=ROLES[d.r].g;S.morale[g]=clamp(S.morale[g]-4,0,100);note(`${d.nm} was let go.`);armed={};render();return;}
  if(a==='proj'){const p=PROJ.find(x=>x.id===el.dataset.id);if(!p||S.proj[p.id]||!p.need()||!canPay(p.c))return;pay(p.c);S.proj[p.id]={wk:p.wk,done:false};note(`${p.n} project started.`);snd('build');render();return;}
  if(a==='leaders'){openSheet('leaders');return;}
  if(a==='close'){closeSheet();render();return;}
  if(a==='sound'){soundOn=!soundOn;store.set('ht-sound',soundOn);snd('tap');renderSheet();return;}
  if(a==='howto'){closeSheet();showHowTo();return;}
  if(a==='restart'){if(!armed.restart)return arm('restart');closeSheet();startGame(S.cfg);return;}
  if(a==='newh'){if(!armed.newh)return arm('newh');closeSheet();store.del('ht-save');showSetup();return;}
}

let mChoices=[],mOpenedAt=0,draft=null;
function showModal(m){

  $('#modal').hidden=false;card.scrollTop=0;

function hideModal(){modalOpen=false;$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{

  const c=mChoices[+b.dataset.i];if(!c)return;hideModal();
  const res=c.f();S.rep=clamp(S.rep,0,100);
  if(res){note(res);showModal({tag:'Outcome',body:res,ch:[{l:'Back to work',f(){return null;}}]});}
  render();saveGame();
});

function showTitle(){
  draft=null;leadersModal=false;
  const sv=store.get('ht-save',null),best=store.get('ht-best',0),got=achGot().length;
  const ch=[];
  if(sv&&sv.cfg&&!sv.over)ch.push({l:`Resume ${esc(sv.cfg.name)}`,d:`Year ${sv.year} · Week ${sv.week} · ${sv.cfg.sandbox?'Sandbox':money(sv.cash)}`,pri:true,f(){resumeGame(sv);return null;}});
  ch.push({l:'New hospital',d:'Name it, pick a scenario, set the rules.',pri:!ch.length,f(){showSetup();return null;}});
  ch.push({l:'Hall of fame',d:`Best score ${int(best)} · ${got}/${ACH.length} achievements`,f(){showLeaders(false);return null;}});
  if(BACK)ch.push({l:'More games',d:'Back to the games page.',f(){location.href=BACK;return null;}});
  showModal({c:'--ed',html:`<div class="logo"><em>H</em>Hospital<br>Tycoon</div>
    <div class="signs"><span style="--c:var(--ed)">ED</span><span style="--c:var(--or)">OR</span><span style="--c:var(--icu)">ICU</span><span style="--c:var(--ms)">MS</span><span style="--c:var(--cath)">CATH</span><span style="--c:var(--img)">CT</span><span style="--c:var(--ld)">L&amp;D</span><span style="--c:var(--cafe)">CAFE</span></div>
    <p>Build a hospital tower floor by floor, hire the physicians who run it, and keep the whole care ecosystem in balance through crises, payment cuts and a demanding board.</p>`,ch});
}
function showHowTo(){
  showModal({c:'--accent',tag:'How to play',title:'Running a hospital',html:`<ul>
    <li><b>Build:</b> tap an empty room in the tower. Put the ED on Floor 1 with Imaging; keep the ORs near the ICU. Tap a built unit to upgrade it.</li>
    <li><b>Hire:</b> open Staff and interview candidates. Traits matter: a Star lifts everyone, a Prima donna produces but sours the team.</li>
    <li><b>Balance:</b> surgeons need anesthesia, beds, nurses and hospitalists for post-op care. Too few and outcomes, morale and money all fall.</li>
    <li><b>Listen:</b> patients and staff say what’s wrong in speech bubbles. The Care tab keeps the latest quotes.</li>
    <li><b>Grow:</b> earn designations like Trauma Center and Magnet Nursing, and buy projects like a surgical robot or helipad in Goals.</li>
    <li><b>Survive:</b> meet each year’s board target for operating income. One miss puts you on probation; two and you’re out.</li></ul>`,ch:[{l:'Got it',f(){return null;}}]});
}
function showSetup(){
  draft=Object.assign({},DEFAULT_CFG,store.get('ht-cfg',{}));if(!Array.isArray(draft.deck))draft.deck=[...DEFAULT_CFG.deck];
  modalOpen=true;mChoices=[];mOpenedAt=Date.now();renderSetup();$('#modal').hidden=false;$('#mCard').scrollTop=0;
}
function renderSetup(){
  const d=draft,card=$('#mCard'),y=card.scrollTop;card.style.setProperty('--c','var(--accent)');
  const seg=(k,opts,n)=>`<div class="seg" style="--n:${n||opts.length}">${opts.map(([v,l,s])=>`<button data-k="${k}" data-v="${v}" aria-pressed="${String(d[k])===String(v)}">${l}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`;
  card.innerHTML=`<div class="eyebrow">New hospital</div><h2>Break ground</h2>
    <div class="field"><h4>Hospital name</h4><input id="hName" maxlength="28" value="${esc(d.name)}" autocomplete="off" aria-label="Hospital name"></div>
    <h4>Scenario</h4><div class="scens">${Object.entries(SCEN).map(([k,s])=>`<button class="scen" data-k="scen" data-v="${k}" aria-pressed="${d.scen===k}"><b>${s.n}<em>${s.tag}</em></b><span>${s.d}</span><span class="num">Start ${money(s.cash)} · max ${s.maxF} floors</span></button>`).join('')}</div>
    <h4>Difficulty</h4>${seg('diff',Object.entries(DIFF).map(([k,v])=>[k,v.n,v.d]))}
    <h4>Mode</h4>${seg('sandbox',[['false','Career','Board targets, score'],['true','Sandbox','Unlimited money']],2)}
    ${d.sandbox?'':`<h4>Length</h4>${seg('len',[[3,'3 years','Quick'],[5,'5 years','Standard'],[10,'10 years','Marathon']])}`}
    <h4>Crises</h4>${seg('freq',[['off','Off'],['low','Low'],['normal','Normal'],['high','High']],4)}
    ${d.freq==='off'?'':`<p class="hint">Tap to include or remove crisis types.</p><div class="deck">${Object.entries(EVNAMES).map(([k,n])=>`<button data-deck="${k}" aria-pressed="${d.deck.includes(k)}">${n}</button>`).join('')}</div>`}
    <h4>Sound</h4>${seg('sound',[['true','On'],['false','Off']],2)}
    <div style="display:grid;gap:8px;margin-top:4px"><button class="choice pri" data-start="1"><b>Break ground</b><span>${esc(SCEN[d.scen].n)} · ${DIFF[d.diff].n} · ${d.sandbox?'Sandbox':d.len+' years'}</span></button><button class="choice" data-cancel="1"><b>Back</b></button></div>`;
  card.scrollTop=y;
}
function setupClick(e){
  const d=draft;if(Date.now()-mOpenedAt<300)return true;
  const nm=$('#hName');if(nm)d.name=nm.value;
  const k=e.target.closest('[data-k]'),dk=e.target.closest('[data-deck]');
  if(k){let v=k.dataset.v;if(k.dataset.k==='len')v=+v;if(k.dataset.k==='sandbox')v=v==='true';
    if(k.dataset.k==='sound'){soundOn=v==='true';store.set('ht-sound',soundOn);d.sound=soundOn;}else d[k.dataset.k]=v;renderSetup();snd('tap');return true;}
  if(dk){const id=dk.dataset.deck,i=d.deck.indexOf(id);if(i>=0)d.deck.splice(i,1);else d.deck.push(id);renderSetup();return true;}
  if(e.target.closest('[data-start]')){d.name=(d.name||'').trim().slice(0,28)||'Mercy General';const cfg={name:d.name,scen:d.scen,diff:d.diff,len:d.len,sandbox:d.sandbox,freq:d.freq,deck:[...d.deck]};store.set('ht-cfg',cfg);draft=null;hideModal();startGame(cfg);return true;}
  if(e.target.closest('[data-cancel]')){draft=null;hideModal();showTitle();return true;}
  return !!e.target.closest('input');
}
$('#mCard').addEventListener('input',e=>{if(draft&&e.target.id==='hName')draft.name=e.target.value;});
$('#mCard').addEventListener('keydown',e=>{if(draft&&e.key==='Enter'&&e.target.id==='hName')e.target.blur();});

function startGame(cfg){
  newGame(cfg);started=true;acc=0;agents=[];vehicles=[];cars=[];lift.y=NaN;closeSheet();hideModal();
  note(`Welcome to ${S.cfg.name}. ${SCEN[S.cfg.scen].d}`);resize();render();scrollGround();snd('build');saveGame();
}
function resumeGame(sv){
  S=sv;S.over=null;started=true;acc=0;agents=[];vehicles=[];cars=[];lift.y=NaN;
  CERTS.forEach(c=>{if(!S.cert[c.id])S.cert[c.id]={held:0,earned:false,on:false};});
  hideModal();resize();render();scrollGround();
}
function scrollGround(){const b=$('#bldg');b.scrollTop=b.scrollHeight;}

/* ================= Wiring ================= */
$('#ov').addEventListener('click',e=>{
  if(e.target.closest('#addFloor')){const c=floorCost();if(!canPay(c)||S.floors.length>=maxFloors())return;pay(c);S.floors.push([null,null,null,null]);note(`Floor ${S.floors.length} added to the tower.`,'good');snd('build');resize();render();$('#bldg').scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});saveGame();return;}
  const t=e.target.closest('[data-f]');if(t){snd('tap');openSheet('slot',[+t.dataset.f,+t.dataset.s]);}
});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)openSheet(b.dataset.s);});
$('#advisor').addEventListener('click',()=>openSheet('quality'));
$('#shClose').addEventListener('click',()=>{closeSheet();render();});
$('#scrim').addEventListener('click',()=>{closeSheet();render();});
$('#shBody').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b);});
$('#bPlay').addEventListener('click',()=>{S.paused=!S.paused;render();});
$('#bSpeed').addEventListener('click',()=>{S.speed=S.speed===1?2:S.speed===2?4:1;render();});
$('#bMenu').addEventListener('click',()=>{if(started&&!S.over)openSheet('menu');else if(!modalOpen)showTitle();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();render();}if(e.key===' '&&!sheet&&!modalOpen&&started&&e.target.tagName!=='INPUT'){e.preventDefault();S.paused=!S.paused;render();}});
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden&&started&&!S.over){S.paused=true;saveGame();}render();});
if(window.ResizeObserver)new ResizeObserver(()=>{if(S){resize();}}).observe($('#bldg'));else window.addEventListener('resize',()=>S&&resize());

function boot(data){
  readPal();
  if(data&&data.S){S=data.S;started=!!data.started;resize();render();scrollGround();if(!started)showTitle();}
  else{newGame(store.get('ht-cfg',{}));started=false;resize();render();scrollGround();showTitle();}
  requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,started}));
const H=window.claude&&window.claude.hot;
H&&H.ready?H.ready(boot):boot(H&&H.data?H.data:{});
</script>

</body>
</html>
