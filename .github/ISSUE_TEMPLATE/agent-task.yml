name: Agent task
description: A change for an AI agent to implement. It starts only after the owner adds the agent:ready label.
title: "[Agent] "
labels: ["agent:proposed"]
body:
  - type: markdown
    attributes:
      value: |
        An agent implements this on its own branch, Codex reviews the exact commit, and the Billy app opens a **draft** pull request. The owner reviews and merges; nothing is deployed automatically. How it works, including from a phone: [docs/agents/handoff.md](https://github.com/DrZaff/ai-medicine-collective/blob/main/docs/agents/handoff.md).
        **This repository is public.** Never put patient information, passwords, keys, private member details or internal addresses in an issue.
  - type: textarea
    id: goal
    attributes:
      label: Objective
      description: What should be true when this is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Who this is for and why it matters now (members, visitors, organizers, the site's upkeep).
  - type: textarea
    id: details
    attributes:
      label: Scope
      description: Pages, files or behaviour to change, and anything the agent should know.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything the agent must not change for this task.
      placeholder: |
        - No changes to .github/workflows/, rulesets, secrets or the newsletter
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell the change works. One check per line.
      placeholder: |
        - The footer links all open the right page
        - Checked in both themes at phone width
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Checks beyond the standard ones in AGENTS.md (site_check.py, browser_smoke.mjs), such as pages to open, inputs to try, or validation cases for clinical logic (normal, abnormal, boundary, invalid).
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to source material, earlier issues or PRs, designs or guidelines, with publication dates for medical sources. Public links only.
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Your estimate. The change is also rated from the files it touches, and the higher of the two applies.
      options:
        - Low (text, styling, docs)
        - Medium (page behaviour, scripts)
        - High (sign-in, member data, a database migration, workflows)
    validations:
      required: true
  - type: checkboxes
    id: clinical
    attributes:
      label: Medical content
      options:
        - label: This changes medical content (tool logic, scores, dosing, blog or evidence text, course material), so a clinician must review it before merging.
  - type: checkboxes
    id: safety
    attributes:
      label: Confirm
      options:
        - label: This issue contains no patient information and no secrets.
          required: true
