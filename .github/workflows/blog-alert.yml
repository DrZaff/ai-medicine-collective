# Emails members who asked for new blog posts, once a post is published.
# Publishing = merging the "Blog draft" pull request, which ADDS
# blog/posts/<date>.json to main (a later correction to the same file does
# not email again, and the database refuses a second alert for a date anyway).
#
# scripts/blog_agent/blog_alert.py builds the email from the post file, waits
# until the post is live on the site (Netlify deploys after the merge), then
# hands it to the database function queue_blog_alert (migration 026), which
# queues one copy per approved member with blog alerts switched on and sends
# them within Resend's daily allowance. No email address ever reaches GitHub.
#
# Setup (one time, by the repo owner):
#   1. Run supabase/migrations/026_about_me_and_blog_alerts.sql.
#   2. Make one long random secret and store it in two places:
#        Supabase SQL Editor:  select vault.create_secret('<secret>', 'blog_alert_secret');
#        GitHub: Settings > Secrets and variables > Actions > New repository
#        secret, name BLOG_ALERT_SECRET, the same value.
# Until the secret exists, this job skips quietly.

name: Blog alert

on:
  push:
    branches: [main]
    paths:
      - "blog/posts/*.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Post date to announce (YYYY-MM-DD)"
        required: true
      dry_run:
        description: "Only print the email (sends nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the posts this push published
        id: find
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            dates="$DATE_INPUT"
          else
            # post files that this push ADDED (not corrections to older ones)
            dates=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'blog/posts/*.json' \
              | sed -nE 's#^blog/posts/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$#\1#p' | sort | tr '\n' ' ')
          fi
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "Posts to announce: ${dates:-none}"

      - name: Email members
        if: steps.find.outputs.dates != ''
        env:
          BLOG_ALERT_SECRET: ${{ secrets.BLOG_ALERT_SECRET }}
          DATES: ${{ steps.find.outputs.dates }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$BLOG_ALERT_SECRET" ]; then
            echo "::notice::BLOG_ALERT_SECRET is not set yet; skipping."
            exit 0
          fi
          status=0
          for date in $DATES; do
            if ! echo "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::Not a post date: $date"; exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              python scripts/blog_agent/blog_alert.py --date "$date" --dry-run || status=1
            else
              # up to 10 minutes for Netlify to publish the post
              python scripts/blog_agent/blog_alert.py --date "$date" --wait-live 600 || status=1
            fi
          done
          exit $status
