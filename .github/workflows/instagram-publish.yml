# Posts a blog post's carousel to Instagram once its draft has been merged.
# The slides (social/<date>/) were reviewed in the same pull request as the
# post, so merging is the approval for both.
#
# Setup (one time, by the repo owner): Settings > Secrets and variables >
# Actions > New repository secret:
#   IG_ACCESS_TOKEN   a long-lived access token for the Instagram account
# Until it exists, this job skips quietly. (IG_USER_ID is optional: the
# account is looked up from the token.)

name: Instagram publish

on:
  push:
    branches: [main]
    paths:
      - "blog/posts/*.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the post to publish (YYYY-MM-DD)"
        required: true
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the posts to publish
        id: find
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            dates="$DATE_INPUT"
          else
            # posts that this push ADDED (a later correction to a post does not post again)
            dates=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'blog/posts/*.json' \
              | sed -E 's#.*/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json#\1#' | sort | tr '\n' ' ')
          fi
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "Posts to publish: ${dates:-none}"

      - name: Publish
        if: steps.find.outputs.dates != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DATES: ${{ steps.find.outputs.dates }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::notice::The Instagram access token is not set yet; skipping."
            exit 0
          fi
          for date in $DATES; do
            if ! echo "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::Not a date: $date"; exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              python scripts/blog_agent/instagram_publish.py --date "$date" --dry-run
            else
              python scripts/blog_agent/instagram_publish.py --date "$date"
            fi
          done
