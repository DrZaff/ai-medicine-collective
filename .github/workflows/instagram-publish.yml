# Posts a carousel to Instagram once its pull request has been merged.
# A carousel is a folder under social/ made by scripts/blog_agent/instagram.py:
# a blog post's (social/<date>/) or an AI vs Human edition's (social/review-<date>/).
# The slides were reviewed in the same pull request, so merging is the approval.
# (The weekly digest's recap is posted by the digest job itself.)
#
# Setup (one time, by the repo owner): Settings > Secrets and variables >
# Actions > New repository secret:
#   IG_ACCESS_TOKEN   a long-lived access token for the Instagram account
# Until it exists, this job skips quietly.

name: Instagram publish

on:
  push:
    branches: [main]
    paths:
      - "social/*/caption.txt"
  workflow_dispatch:
    inputs:
      date:
        description: "Folder under social/ to publish (for a blog post, its date)"
        required: true
      dry_run:
        description: "Only show what would be posted, and check the token (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the posts to publish
        id: find
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            dates="$DATE_INPUT"
          else
            # carousels that this push ADDED (a later correction does not post again)
            dates=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'social/*/caption.txt' \
              | sed -E 's#^social/([^/]+)/caption\.txt$#\1#' | sort | tr '\n' ' ')
          fi
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "Posts to publish: ${dates:-none}"

      - name: Publish
        if: steps.find.outputs.dates != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DATES: ${{ steps.find.outputs.dates }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::notice::The Instagram access token is not set yet; skipping."
            exit 0
          fi
          for date in $DATES; do
            if ! echo "$date" | grep -Eq '^[A-Za-z0-9-]+$'; then
              echo "::error::Not a carousel name: $date"; exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              python scripts/blog_agent/instagram_publish.py --date "$date" --dry-run
            else
              python scripts/blog_agent/instagram_publish.py --date "$date"
            fi
          done
