# Drafts the AI-in-medical-education briefing (Mon/Wed/Fri) and opens a PR.
# Merging the PR publishes the post (human review step, see CLAUDE.md).
#
# Setup (one time, by the repo owner):
#   1. Settings > Secrets and variables > Actions > New repository secret:
#      ANTHROPIC_API_KEY
#   2. Settings > Actions > General > Workflow permissions:
#      check "Allow GitHub Actions to create and approve pull requests"
# Until the secret exists, scheduled runs skip quietly.

name: Blog draft

on:
  schedule:
    # Early on purpose: GitHub starts scheduled jobs late (4 and 8 hours late
    # in the first week), so this leaves room to still land by morning.
    - cron: "23 7 * * 1,3,5" # Mon/Wed/Fri, 3:23 AM EDT / 2:23 AM EST
  workflow_dispatch:
    inputs:
      date:
        description: "Date to draft (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set yet; skipping this draft."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/blog_agent/requirements.txt

      - name: Install dependencies
        if: steps.key.outputs.ok == 'true'
        run: pip install -r scripts/blog_agent/requirements.txt

      - name: Draft the post
        id: draft
        if: steps.key.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          args=(--pr-body "$RUNNER_TEMP/pr-body.md")
          if [ -n "$DATE_INPUT" ]; then args+=(--date "$DATE_INPUT"); fi
          python scripts/blog_agent/agent.py "${args[@]}"

      - name: Open pull request
        if: steps.draft.outputs.post_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.draft.outputs.date }}
        run: |
          branch="blog/$DATE"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::A draft branch for $DATE already exists; not opening another."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "blog/posts/$DATE.json"
          git commit -m "Blog draft for $DATE"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Blog draft: $DATE" \
            --body-file "$RUNNER_TEMP/pr-body.md"
