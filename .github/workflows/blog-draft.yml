# Drafts the AI-in-medical-education briefing (Mon/Wed/Fri) and opens a PR.
# Merging the PR publishes the post (human review step, see CLAUDE.md).
#
# Setup (one time, by the repo owner):
#   1. Settings > Secrets and variables > Actions > New repository secret:
#      ANTHROPIC_API_KEY
#   2. Settings > Actions > General > Workflow permissions:
#      check "Allow GitHub Actions to create and approve pull requests"
# Until the secret exists, scheduled runs skip quietly.

name: Blog draft

on:
  schedule:
    # GitHub starts scheduled jobs late and sometimes not at all, so there are
    # three start times here, and the database starts the job on time as well
    # (migration 018). The first start that runs writes the draft; the others
    # see that the day is already handled and stop before spending anything.
    - cron: "23 7 * * 1,3,5"  # Mon/Wed/Fri, 3:23 AM EDT / 2:23 AM EST
    - cron: "23 10 * * 1,3,5" # backup, 3 hours later
    - cron: "23 13 * * 1,3,5" # backup, 6 hours later
  workflow_dispatch:
    inputs:
      date:
        description: "Date to draft (YYYY-MM-DD). Leave empty for today."
        required: false
      scheduled:
        description: "Set by the database's timetable; leave as false when starting by hand."
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set yet; skipping this draft."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      # A scheduled start (GitHub's or the database's) whose day is already
      # drafted, published or skipped has nothing to do. A start by hand
      # always goes ahead, so it can top up a draft that is missing a review.
      - name: Check whether today is already handled
        id: today
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ github.event.inputs.scheduled }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          date="${DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "schedule" ] && [ "$SCHEDULED" != "true" ]; then
            echo "todo=true" >> "$GITHUB_OUTPUT"
          elif [ -f "blog/posts/$date.json" ]; then
            echo "::notice::The post for $date is already published."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh pr list --state all --head "blog/$date" --json number --jq length)" != "0" ]; then
            echo "::notice::A draft for $date already exists (open, merged or closed)."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.today.outputs.todo == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/blog_agent/requirements.txt

      - name: Install dependencies
        if: steps.today.outputs.todo == 'true'
        run: pip install -r scripts/blog_agent/requirements.txt

      - name: Draft the post
        id: draft
        if: steps.today.outputs.todo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          args=(--pr-body "$RUNNER_TEMP/pr-body.md")
          if [ -n "$DATE_INPUT" ]; then args+=(--date "$DATE_INPUT"); fi
          # A draft for this date that is still waiting for review: bring its
          # file in, so the agent can add a review it is missing (--fill)
          # instead of starting again.
          date="${DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          # (never a post that is already published, i.e. already in this checkout)
          if [ ! -e "blog/posts/$date.json" ] && git ls-remote --exit-code --heads origin "blog/$date" > /dev/null; then
            git fetch --quiet origin "blog/$date"
            if git cat-file -e "FETCH_HEAD:blog/posts/$date.json" 2> /dev/null; then
              mkdir -p blog/posts
              git show "FETCH_HEAD:blog/posts/$date.json" > "blog/posts/$date.json"
              args+=(--fill)
            fi
          fi
          python scripts/blog_agent/agent.py "${args[@]}"
          # The Instagram slides and caption for this post (no AI call), so
          # they are reviewed in the same pull request
          if [ -f "blog/posts/$date.json" ]; then
            python scripts/blog_agent/instagram.py --date "$date"
          fi

      - name: Open pull request
        id: pr
        if: steps.draft.outputs.post_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.draft.outputs.date }}
        run: |
          branch="blog/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # The draft already has a branch: the agent topped it up. Put the
            # new file on that branch and refresh the description.
            cp "blog/posts/$DATE.json" "$RUNNER_TEMP/post.json"
            rm "blog/posts/$DATE.json"
            rm -rf "$RUNNER_TEMP/social" && mv "social/$DATE" "$RUNNER_TEMP/social"
            git fetch --quiet origin "$branch"
            git switch --quiet -C "$branch" FETCH_HEAD
            cp "$RUNNER_TEMP/post.json" "blog/posts/$DATE.json"
            rm -rf "social/$DATE" && mkdir -p social && mv "$RUNNER_TEMP/social" "social/$DATE"
            git add "blog/posts/$DATE.json" "social/$DATE"
            if git diff --cached --quiet; then
              echo "::notice::No second review was found for $DATE; the draft is unchanged."
            else
              git commit -m "Blog draft for $DATE: add the missing review"
              git push origin "$branch"
              # worth telling the organizers: the draft now has more to review
              echo "url=$(gh pr view "$branch" --json url --jq .url 2> /dev/null)" >> "$GITHUB_OUTPUT"
            fi
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"               || echo "::notice::No open pull request for $branch to update."
            exit 0
          fi
          git switch -c "$branch"
          git add "blog/posts/$DATE.json" "social/$DATE"
          git commit -m "Blog draft for $DATE"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Blog draft: $DATE" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Tell the organizers what to do next. Needs the RESEND_API_KEY and
      # NOTIFY_EMAIL secrets; without them these steps send nothing.
      - name: Email - a draft is ready to review
        if: steps.pr.outputs.url != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DATE: ${{ steps.draft.outputs.date }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "A blog draft for $DATE is waiting for your review. It is not published yet."
            echo
            echo "WHAT TO DO"
            echo "1. Read the draft and its Instagram slides: $PR_URL"
            echo "2. For a fact-check first, tell Claude: \"the blog draft is in\"."
            echo "3. To publish, tell Claude \"merge it\", or press \"Merge pull request\" on that page."
            echo "   Merging also posts the Instagram carousel."
            echo "   To skip this post, close the pull request without merging."
            echo
            echo "On Fridays, publish before about 5 PM Eastern so the post makes this week's digest."
            echo
            echo "----- THE DRAFT -----"
            cat "$RUNNER_TEMP/pr-body.md"
          } > "$RUNNER_TEMP/email.txt"
          python scripts/blog_agent/notify.py --subject "Action needed: review the blog draft for $DATE" --body-file "$RUNNER_TEMP/email.txt"

      - name: Email - nothing qualified today
        if: steps.today.outputs.todo == 'true' && steps.draft.outcome == 'success' && steps.draft.outputs.post_created != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DATE: ${{ steps.today.outputs.date }}
        run: |
          python scripts/blog_agent/notify.py --subject "No blog post today ($DATE): nothing to do" \
            --body "The blog agent ran for $DATE and found nothing that passed its checks, so there is no draft and nothing for you to do. The next scheduled draft will run as usual."

      - name: Email - the run failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Today's blog draft run failed, so there is no draft yet."
            echo
            echo "WHAT TO DO"
            echo "Either tell Claude: \"re-run the blog draft\","
            echo "or open the run and press \"Re-run jobs\": $RUN_URL"
            echo
            echo "A backup start may also run by itself later today; if a draft email follows this one, you can ignore this."
          } > "$RUNNER_TEMP/email.txt"
          python scripts/blog_agent/notify.py --subject "Action needed: the blog draft run failed" --body-file "$RUNNER_TEMP/email.txt"
