# Drafts one new (or refreshed) FAQ answer every other day and opens a PR.
# Merging the PR publishes it on faq.html (human review step, see CLAUDE.md).
# Uses the same ANTHROPIC_API_KEY secret as the blog draft job; skips quietly
# without it. Branches faq/<date> belong to this job.

name: FAQ draft

on:
  schedule:
    - cron: "17 10 1-31/2 * *" # odd days of the month, about 6 AM Eastern
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the draft (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: faq-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # The branch this run pushed, for the site-checks job below
    outputs:
      pushed_branch: ${{ steps.pr.outputs.branch }}
    timeout-minutes: 20
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set yet; skipping this FAQ draft."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      # One draft per date: a date that already has a branch (open, merged or
      # closed pull request) is left alone
      - name: Check whether today is already handled
        id: today
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          date="${DATE_INPUT:-$(TZ=America/New_York date +%F)}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "$(gh pr list --state all --head "faq/$date" --json number --jq length)" != "0" ]; then
            echo "::notice::An FAQ draft for $date already exists."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.today.outputs.todo == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/blog_agent/requirements.txt

      - name: Install dependencies
        if: steps.today.outputs.todo == 'true'
        run: pip install -r scripts/blog_agent/requirements.txt

      - name: Draft the answer
        id: draft
        if: steps.today.outputs.todo == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE: ${{ steps.today.outputs.date }}
        run: python scripts/blog_agent/faq_agent.py --date "$DATE" --pr-body "$RUNNER_TEMP/pr-body.md"

      - name: Open pull request
        id: pr
        if: steps.draft.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.draft.outputs.date }}
          FAQ_ID: ${{ steps.draft.outputs.faq_id }}
        run: |
          branch="faq/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add faq/faq.json faq/targets.json
          question=$(python -c "import json,sys; d=json.load(open('faq/faq.json',encoding='utf-8')); i=[x for x in d['items'] if x['id']==sys.argv[1]][0]; print(i['question'])" "$FAQ_ID")
          git commit -m "FAQ draft for $DATE: $question"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          url=$(gh pr create --base main --head "$branch" \
            --title "FAQ draft: $DATE" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Email - a draft is ready to review
        if: steps.pr.outputs.url != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DATE: ${{ steps.draft.outputs.date }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "A new FAQ answer is waiting for your review. It is not published yet."
            echo
            echo "WHAT TO DO"
            echo "1. Read the answer and check its numbers against the sources: $PR_URL"
            echo "2. For a fact-check first, tell Claude: \"the FAQ draft is in\"."
            echo "3. To publish, tell Claude \"merge it\", or press \"Merge pull request\" on that page."
            echo "   To skip it, close the pull request without merging."
            echo
            echo "----- THE DRAFT -----"
            cat "$RUNNER_TEMP/pr-body.md"
          } > "$RUNNER_TEMP/email.txt"
          python scripts/blog_agent/notify.py --subject "Action needed: review the FAQ draft for $DATE" --body-file "$RUNNER_TEMP/email.txt"

      - name: Email - the run failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/blog_agent/notify.py --subject "The FAQ draft run failed" \
            --body "Today's FAQ draft run failed, so there is no new answer. Nothing is broken on the site. To try again, tell Claude \"re-run the FAQ draft\", or open the run and press \"Re-run jobs\": $RUN_URL"

  # Pull requests opened with the default token don't start other workflows,
  # so Site checks would never run on this one. The default token may start
  # a workflow by hand (workflow_dispatch), so this job asks for a run on the
  # branch just pushed; its checks land on the pull request's latest commit.
  # It checks out no code, uses no secrets and is the only job here allowed
  # to start workflows.
  site-checks:
    name: Start Site checks on the pull request
    needs: draft
    if: always() && needs.draft.outputs.pushed_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run Site checks on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.draft.outputs.pushed_branch }}
        run: gh workflow run site-checks.yml --ref "$BRANCH"
