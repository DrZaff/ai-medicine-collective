# Every Friday afternoon, assembles the weekly digest (HTML, plain text and a
# suggested subject line) from the week's published blog posts and new hub
# projects, and publishes the files to the site by committing them to main.
# No AI call and no secrets needed.
#
# Publishing the files emails nobody. An admin still sends the digest from
# the Moderation page (load the week, add a note, preview and edit, test,
# send), and that preview is the review step. The owner chose this on
# 2026-10-07 in place of a pull request each Friday; it is the one automated
# exception to "never commit directly to main" (see CLAUDE.md).
#
# Who pushes: a dedicated GitHub App ("digest publisher"), so the ruleset on
# main can let exactly this job through without letting every workflow
# through (a bypass for github-actions[bot] would cover all of them).
# Until the App's secrets exist, the job pushes with the default token as
# before, so merging this change breaks nothing.
#
# Setup (one time, by the repo owner):
#   1. Settings > Developer settings > GitHub Apps > New GitHub App.
#      Name it, e.g. "AMC Digest Publisher". Untick Webhook "Active".
#      Repository permissions: Contents = Read and write; nothing else.
#      "Only on this account". Create it, note the App ID, and generate a
#      private key (a .pem file downloads).
#   2. Install the App on this repository only.
#   3. Settings > Environments > New environment: digest-publish.
#      Deployment branches: Selected branches > add "main" only, so pull
#      request workflows can never read its secrets.
#      Environment secrets: DIGEST_APP_ID (the App ID) and
#      DIGEST_APP_PRIVATE_KEY (the whole .pem file). Then delete the .pem.
#   4. In the main ruleset, add the App as the only bypass actor.
#   5. Run this workflow by hand from main and check it publishes.

name: Weekly digest

on:
  schedule:
    - cron: "0 21 * * 5" # Fridays, 5 PM EDT / 4 PM EST
  workflow_dispatch:
  # A post merged after Friday's build (say, Friday's own post, merged in the
  # evening) belongs in that week's issue: rebuild it then.
  push:
    branches: [main]
    paths:
      - "blog/posts/*.json"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only main may use this environment, so only main can read the App's key.
    environment: digest-publish
    steps:
      - name: Check for the digest publisher App
        id: app
        env:
          DIGEST_APP_ID: ${{ secrets.DIGEST_APP_ID }}
          DIGEST_APP_PRIVATE_KEY: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$DIGEST_APP_ID" ] && [ -n "$DIGEST_APP_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The digest publisher App is not set up yet; pushing with the default token (see the top of this file)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a token for the digest publisher App
        id: token
        if: steps.app.outputs.ok == 'true'
        # This action receives the App's private key, so it is pinned to an
        # exact commit (release v1.12.0, the code "@v1" pointed to on
        # 2026-11-11) rather than a tag that could be moved. To upgrade, look
        # up the new release's commit and change both the hash and the note.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.DIGEST_APP_ID }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          # Only this repository (the default, written out) and only file
          # contents: the job checks out, commits and pushes, nothing else.
          repositories: ai-medicine-collective
          permission-contents: write

      # The push at the end uses whichever token checked the code out.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build newsletter
        id: build
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Rebuild this week's issue, if there is one from the last six days
            issue=$(python -c "import json; print(json.load(open('newsletter/latest.json'))['date'])")
            today=$(TZ=America/New_York date +%F)
            if [ $(( ($(date -d "$today" +%s) - $(date -d "$issue" +%s)) / 86400 )) -gt 6 ]; then
              echo "::notice::No issue from this week to rebuild."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python scripts/blog_agent/newsletter.py --date "$issue"
          else
            python scripts/blog_agent/newsletter.py
          fi

      - name: Publish to the site
        id: publish
        if: steps.build.outputs.created == 'true'
        env:
          DATE: ${{ steps.build.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "newsletter/$DATE.html" "newsletter/$DATE.txt" "newsletter/$DATE.json" newsletter/latest.json
          if [ -f "newsletter/$DATE.leads.json" ]; then git add "newsletter/$DATE.leads.json"; fi
          if git diff --cached --quiet; then
            echo "::notice::The digest for $DATE is already published and unchanged."
            exit 0
          fi
          git commit -m "Weekly digest for week ending $DATE"
          # A blog post may have been merged while this ran
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::notice::Published newsletter/$DATE.html. Send it from the Moderation page."
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Tell the organizers what to do next. Needs the RESEND_API_KEY and
      # NOTIFY_EMAIL secrets; without them these steps send nothing. A second
      # start on the same Friday finds nothing changed and stays quiet.
      - name: Email - the digest is ready to send
        if: steps.publish.outputs.published == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DATE: ${{ steps.build.outputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          subject=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['subject'])" "newsletter/$DATE.json")
          {
            if [ "$EVENT" = "push" ]; then
              echo "A blog post merged after Friday's build has been added to this week's digest ($DATE)."
              echo "If you have not sent the digest yet, the version on the Moderation page now includes it."
              echo "If you already sent it, there is nothing to do."
            else
              echo "This week's digest ($DATE) is published on the site and ready for you to send. Nobody has been emailed."
              echo
              echo "Suggested subject line: $subject"
              echo
              echo "WHAT TO DO"
              echo "1. Open the Moderation page: https://www.aimedicinecollective.com/moderate.html"
              echo "2. Scroll to \"Weekly digest\" and click Load."
              echo "3. If you like, pick a different lead story."
              echo "4. Write a short note in your own words."
              echo "5. Click \"Preview and edit\" and change anything you like."
              echo "6. Click \"Send test to me\" and check it in your inbox."
              echo "7. Click \"Send to members\"."
              echo
              echo "Web copy: https://www.aimedicinecollective.com/newsletter/$DATE.html"
              echo "To skip this week, do nothing."
            fi
          } > "$RUNNER_TEMP/email.txt"
          if [ "$EVENT" = "push" ]; then title="This week's digest now includes a newly published post"; else title="Action needed: this week's digest is ready to send"; fi
          python scripts/blog_agent/notify.py --subject "$title" --body-file "$RUNNER_TEMP/email.txt"

      - name: Email - the run failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/blog_agent/notify.py --subject "Action needed: the weekly digest run failed" \
            --body "This week's digest was not built. Tell Claude \"the digest run failed\", or open the run and press \"Re-run jobs\": $RUN_URL"
