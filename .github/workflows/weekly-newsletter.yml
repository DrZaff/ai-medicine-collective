# Every Friday afternoon, assembles the weekly digest (HTML, plain text and a
# suggested subject line) from the week's published blog posts and new hub
# projects, and publishes the files to the site by committing them to main.
# No AI call and no secrets needed.
#
# Publishing the files emails nobody. An admin still sends the digest from
# the Moderation page (load the week, add a note, preview and edit, test,
# send), and that preview is the review step. The owner chose this on
# 2026-10-07 in place of a pull request each Friday; it is the one automated
# exception to "never commit directly to main" (see CLAUDE.md).

name: Weekly digest

on:
  schedule:
    - cron: "0 21 * * 5" # Fridays, 5 PM EDT / 4 PM EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build newsletter
        id: build
        run: python scripts/blog_agent/newsletter.py

      - name: Publish to the site
        if: steps.build.outputs.created == 'true'
        env:
          DATE: ${{ steps.build.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "newsletter/$DATE.html" "newsletter/$DATE.txt" "newsletter/$DATE.json" newsletter/latest.json
          if git diff --cached --quiet; then
            echo "::notice::The digest for $DATE is already published and unchanged."
            exit 0
          fi
          git commit -m "Weekly digest for week ending $DATE"
          # A blog post may have been merged while this ran
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::notice::Published newsletter/$DATE.html. Send it from the Moderation page."
