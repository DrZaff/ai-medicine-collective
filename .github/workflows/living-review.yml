# Drafts the monthly edition of the living review "AI vs Human" and opens a PR.
# Merging the PR publishes the edition (human review step, see CLAUDE.md).
# Uses the same ANTHROPIC_API_KEY secret and settings as the blog draft job.

name: Living review

on:
  schedule:
    - cron: "17 9 1 * *" # the 1st of each month, about 5 AM Eastern
  workflow_dispatch:
    inputs:
      date:
        description: "Date of the edition (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: living-review
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set yet; skipping this edition."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/blog_agent/requirements.txt

      - name: Install dependencies
        if: steps.key.outputs.ok == 'true'
        run: pip install -r scripts/blog_agent/requirements.txt

      - name: Draft the edition
        id: draft
        if: steps.key.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          args=(--pr-body "$RUNNER_TEMP/pr-body.md")
          if [ -n "$DATE_INPUT" ]; then args+=(--date "$DATE_INPUT"); fi
          python scripts/blog_agent/living_review.py "${args[@]}"

      - name: Open pull request
        if: steps.draft.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.draft.outputs.date }}
          EDITION: ${{ steps.draft.outputs.edition }}
        run: |
          branch="review/ai-vs-human-$DATE"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::A draft for $DATE already exists; not opening another."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add evidence/ai-vs-human.json
          git commit -m "AI vs Human: edition $EDITION ($DATE)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "AI vs Human: edition $EDITION ($DATE)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
