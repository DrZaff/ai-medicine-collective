# NextSet Sync (nextset-sync/): build the iPhone app on a GitHub macOS runner
# and run every test, so the project can be developed without a Mac.
# No secrets, no signing, no deploy. Runs only for the NextSet Sync branch and
# folder; it does not touch the website. TestFlight uploads live in
# nextset-sync/.github/workflows/testflight.yml (for the project's own repo).
name: NextSet Sync build and tests

on:
  push:
    branches: [claude/bangle-iphone-workout-sleep-x9j8xy]
    paths: ['nextset-sync/**', '.github/workflows/nextset-sync-ios.yml']
  # Pull requests into the NextSet Sync branch (e.g. Codex's work) get the same
  # Xcode build and tests on their merge ref. A submitted review re-runs it, so
  # a reviewer can verify the exact commit under review.
  pull_request:
    branches: [claude/bangle-iphone-workout-sleep-x9j8xy]
    paths: ['nextset-sync/**', '.github/workflows/nextset-sync-ios.yml']
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextset-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS app (Xcode, macOS)
    if: github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'claude/bangle-iphone-workout-sleep-x9j8xy'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nextset-sync
    steps:
      - uses: actions/checkout@v4
      - name: What is being built
        run: git log -3 --format='%h %s' && git diff --stat HEAD~1 -- . | tail -3 || true
      - name: Pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Swift core tests on macOS
        run: cd ios/NextSetSyncCore && swift test 2>&1 | tail -40
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project ios/nextset-sync.xcodeproj -scheme NextSetSync \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim.log
          # Keep the app warning-free: any Swift compiler warning fails the build.
          if grep -E "\.swift:[0-9]+:[0-9]+: warning:" sim.log; then echo "::error::Swift warnings (above)"; exit 1; fi
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ios/nextset-sync.xcodeproj -scheme NextSetSync \
            -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee device.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" device.log
          mkdir -p Payload && cp -R build/device/Build/Products/Release-iphoneos/NextSetSync.app Payload/
          zip -qry NextSetSync-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NextSetSync-unsigned-ipa
          path: nextset-sync/NextSetSync-unsigned.ipa
          retention-days: 14
      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: nextset-sync/*.log

  watch:
    name: Watch app + Swift core (Linux, real Espruino)
    if: github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'claude/bangle-iphone-workout-sleep-x9j8xy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nextset-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: nextset-sync/.espruino
          key: espruino-2v29-${{ runner.os }}
      - name: Swift toolchain
        run: swift --version
      - name: All tests (watch code in Espruino 2v29, Swift core, bridge)
        run: scripts/run-tests.sh
