# Builds, signs and uploads NextSet Sync to TestFlight from a GitHub macOS
# runner: no Mac needed. Start it by hand: Actions > TestFlight > Run workflow.
#
# Works once this folder (nextset-sync/) is the root of its own repository.
# One-time setup (all in a browser): docs/no-mac-setup.md
#   Secrets (Settings > Secrets and variables > Actions, environment "testflight"):
#     ASC_KEY_ID      App Store Connect API key id      (e.g. 2X9R4HXF34)
#     ASC_ISSUER_ID   issuer id shown above the key list (a UUID)
#     ASC_KEY_P8      the whole .p8 file, pasted as text
#   Variables:
#     APPLE_TEAM_ID   your 10-character team id
#     BUNDLE_ID       optional, default com.zaffuto.nextsetsync
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What to test in this build (shown in TestFlight)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE: ${{ vars.BUNDLE_ID || 'com.zaffuto.nextsetsync' }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing (see docs/no-mac-setup.md)"; exit 1; fi
      - name: Pick the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Tests first
        run: cd ios/NextSetSyncCore && swift test 2>&1 | tail -20
      - name: Write the API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$P8" > "$RUNNER_TEMP/asc.p8"
      - name: Archive (signed by Xcode cloud signing)
        run: |
          xcodebuild -project ios/nextset-sync.xcodeproj -scheme NextSetSync -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NextSetSync.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive 2>&1 | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
      - name: Upload to App Store Connect (TestFlight)
        run: |
          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" -c "Add :destination string upload" \
            -c "Add :teamID string $TEAM" -c "Add :signingStyle string automatic" \
            -c "Add :uploadSymbols bool true" -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NextSetSync.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log
          echo "Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple's processing (usually 5-30 minutes)."
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logs
          path: "*.log"
